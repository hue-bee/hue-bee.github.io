<style id="passage-annotation-style">
.passage-highlight { border-radius: 3px; padding: 0 1px; }
.passage-underline { text-decoration: underline; text-decoration-thickness: 2px; }
.passage-outline { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 3px; }
.passage-note {
  display: inline-block;
  width: 14px; height: 14px;
  background: #374151; color: white;
  border-radius: 50%;
  font-size: 0.6rem; font-weight: 800;
  text-align: center; line-height: 14px;
  cursor: pointer;
  position: relative;
  vertical-align: super;
  margin-left: 2px;
  font-style: normal;
}
.passage-note .note-tooltip {
  display: none;
  position: absolute;
  bottom: 120%;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: white;
  font-size: 0.72rem;
  padding: 5px 9px;
  border-radius: 8px;
  z-index: 200;
  pointer-events: none;
  width: max-content;
  max-width: 220px;
  white-space: normal;
}
.passage-note:hover .note-tooltip { display: block; }

#fiction-passage {user-select:text;-webkit-user-select:text;cursor:text}
#passage-annotation-tools {align-items:center}
#passage-annotation-tools .annot-label {font-size:.68rem;color:#6b7280;font-weight:700}
#passage-annotation-tools .annot-color-row {display:inline-flex;gap:7px;align-items:center;padding:4px}
#passage-annotation-tools .annot-color-swatch {width:18px;height:18px;border-radius:50%;padding:0;border:2px solid rgba(0,0,0,.1);cursor:pointer}
#passage-annotation-tools .annot-color-swatch.active {border-color:#374151;box-shadow:0 0 0 2px white,0 0 0 4px #374151}
#fiction-passage .passage-note:focus .note-tooltip,
#fiction-passage .passage-note.note-open .note-tooltip {display:block}
#fiction-passage .note-input-wrapper {display:inline-flex;align-items:center;gap:4px;background:white;border:1.5px solid #374151;border-radius:8px;padding:2px 6px;margin-left:4px;vertical-align:middle;font-style:normal}
#fiction-passage .note-input-wrapper input {width:130px;max-width:35vw;border:0;background:transparent;font:inherit;font-size:.72rem;color:#374151}
#fiction-passage .note-input-wrapper button {border:0;border-radius:4px;cursor:pointer;background:#374151;color:white;padding:2px 5px}
#fiction-passage .passage-note,.note-input-wrapper {user-select:none;-webkit-user-select:none}
#fiction-passage .passage-outline {box-decoration-break:clone;-webkit-box-decoration-break:clone}
</style>
</head>

<script>
"use strict";
const official="https://www.schools.nyc.gov/learning/testing/specialized-high-school-admissions-test";
const guide="https://www.schools.nyc.gov/learning/testing/how-to-prepare-for-the-specialized-high-schools-admissions-test1";
const zones=["Cold redo · 00–20","Formula recall · 20–35","Grammar recall · 35–50","Fiction block · 50–60"];
const slides=[];
const field=(id,placeholder="Write your reasoning here…",height=82)=>`<div class="work-box"><textarea id="${id}" aria-label="${placeholder}" placeholder="${placeholder}" style="min-height:${height}px"></textarea></div>`;
const recall=(id,label)=>`<input type="text" id="${id}" aria-label="${label}" placeholder="Recall from memory…">`;
const box=(title,text)=>`<div class="prompt-box"><h3>${title}</h3><p>${text}</p></div>`;
const info=(title,text)=>`<div class="info-card"><h3>${title}</h3><div class="prose">${text}</div></div>`;
const source=(text,url=official,name="NYC Public Schools")=>`<div class="source-note">${text.replace(/\.$/,"")} (<a href="${url}" target="_blank" rel="noopener">${name}</a>).</div>`;
const figure=(svg,caption)=>`<figure class="diagram-wrap">${svg}<figcaption>${caption}</figcaption></figure>`;
const svg=(body,label,vb="0 0 440 250")=>`<svg viewBox="${vb}" role="img" aria-label="${label}">${body}</svg>`;
function add(title,kicker,body,zone=-1,extra=""){slides.push({title,kicker,body,zone,extra});}
function options(id,items,multi=false){return `<div class="mc-options">${items.map((x,i)=>`<label class="mc-option"><input type="${multi?"checkbox":"radio"}" name="${id}" value="${String.fromCharCode(65+i)}"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${x}</span></label>`).join("")}</div>`;}
const dotplot=figure(svg(`<text x="220" y="28" text-anchor="middle" class="heavy">Delivery times, in days</text><line x1="50" y1="185" x2="390" y2="185" stroke="#4d4d4d" stroke-width="2"/><g fill="#4d4d4d"><circle cx="70" cy="160" r="9"/><circle cx="70" cy="134" r="9"/><circle cx="170" cy="160" r="9"/><circle cx="170" cy="134" r="9"/><circle cx="170" cy="108" r="9"/><circle cx="270" cy="160" r="9"/><circle cx="370" cy="160" r="9"/><circle cx="370" cy="134" r="9"/></g><g text-anchor="middle"><text x="70" y="210">1</text><text x="170" y="210">3</text><text x="270" y="210">5</text><text x="370" y="210">7</text><text x="220" y="242">Each dot represents one delivery.</text></g>`,"Dot plot: two deliveries took 1 day, three took 3 days, one took 5 days, and two took 7 days."),"Equal tick spacing represents two days. Dots are stacked only to show frequency.");

add("One Question. <span class='tint'>One Clean Decision.</span>","00:01–00:02 · Cold redo protocol",`<div class="grid2"><div class="stack">${box("Before the calculation","What is being asked? What rough size or direction should the result have? Write an estimate before exact arithmetic.")}${box("Before you advance","Did I answer the requested quantity, use the right base or unit, and enter the required form? A confident method still needs an entry check.")}</div><div class="stack">${info("Today’s timing","Items 1–15: 00:02–00:17. Use about one minute per item on average; borrow time within the 15-minute window. Selective repair: 00:17–00:20.")}${info("Teacher navigation is not TestNav","The bottom arrows and dots remain available for teaching. During the cold redo, do not revisit an earlier standalone item. This deck is fixed practice, not an adaptive score predictor.")}</div></div>${source("On the 2026 SHSAT, math and standalone ELA items cannot be revisited after advancing; passage-set questions can be reviewed before that set is submitted.")}<div class="trap-card" style="margin-top:.7rem"><h3>Do not read the next screen as a score report</h3><p>Make your best attempt on this item. Do not infer whether the previous response was correct from how hard the next question feels.</p></div>`,0);
const questions=[
{id:1,l:2,title:"Percent change: find the reference point",q:"A club’s membership rose from 200 to 214. What was the percent increase? Enter the number of percent, without a percent sign.",ph:"Estimate; setup; numerical percent…"},
{id:2,l:3,title:"Reverse percent: recover the whole",q:"After a 25% discount, a backpack costs $54 before tax. What was its original price? Enter dollars.",ph:"Estimate the original; write a relationship; solve…"},
{id:3,l:4,title:"Averages: give each student a voice",q:"Twelve students have a mean score of 16 points. Eight other students have a mean score of 21 points. What is the mean score of all 20 students?",diagram:groups,ph:"Estimate; count × mean for each group; combine…"},
{id:4,l:2,title:"Fractions: keep the pieces the same size",q:"Evaluate 5 1/6 − 2 3/4. Give your result as a fraction or a mixed number in simplest form.",ph:"Estimate; convert; subtract; simplify…"},
{id:5,l:2,title:"Circle area: identify the given segment",q:"The circle shown has diameter 14 cm. What is its area, in square centimeters? Give your result as a multiple of π.",diagram:circle,ph:"Estimate the radius; write the area relationship…"},
{id:6,l:3,title:"Inequalities: test every candidate",q:"Select all values of x that satisfy −3(2x − 5) > 27.",choices:["−4","−3","−2","3"],multi:true,ph:"Solve; record true/false for each option; then select…"},
{id:7,l:3,title:"Counting: do the roles matter?",q:"Six students are eligible to be captain, recorder, and presenter. Each role goes to a different student. How many different assignments are possible?",ph:"Estimate; identify the choices remaining for each role…"},
{id:8,l:4,title:"Probability: update the bag",q:"A bag contains 5 blue counters and 3 red counters. Two counters are drawn at random without replacement. What is the probability that both are red? Give a simplified fraction.",diagram:draws,ph:"Estimate; first draw; conditional second draw; combine…"},
{id:9,l:3,title:"Measurement: land on the requested unit",q:"A pump moves 18 gallons per minute. The liquid weighs 8.4 pounds per gallon. How many pounds does it move in 25 seconds?",ph:"Estimate; write one unit-cancellation chain; compute…"},
{id:10,l:3,title:"Data: count observations, not labels",q:"The dot plot shows eight delivery times. What is the median delivery time, in days?",diagram:dotplot,ph:"Count the observations; locate the middle positions…"},
{id:11,l:2,title:"Editing: essential or extra?",q:"Context: the science club owns exactly one telescope. Which sentence correctly punctuates the extra information about it?",choices:["The telescope which the club bought last spring, needs a new lens.","The telescope, which the club bought last spring, needs a new lens.","The telescope, which the club bought last spring needs a new lens.","The telescope which, the club bought last spring, needs a new lens."],ph:"Choose one; name the role of the inserted clause…"},
{id:12,l:3,title:"Revision: close the argument you have",q:"A paragraph argues that a school repair table reduces waste while giving students practical skills. It describes repairing torn bags and replacing loose buttons. Which sentence best concludes the paragraph?",choices:["Many students prefer blue backpacks to green ones.","Every broken object can always be repaired at school.","The table keeps usable belongings out of the trash and helps students learn to fix them.","The school should also install more drinking fountains."],ph:"Choose one; identify the claim the ending must complete…"},
{id:13,l:4,title:"Purpose: content is not function",q:"Read the short passage, then identify why the author includes the faded-stamp detail.",text:"The library’s seed exchange did more than distribute packets. When an old date stamp faded, volunteers began recording each donation’s season and growing conditions by hand. The extra notes soon helped neighbors choose seeds suited to their balconies. A small inconvenience had turned a simple exchange into a shared record of local experience.",choices:["To explain why faded ink is difficult to read","To establish that handwritten records are always more accurate","To illustrate how a minor obstacle led to a more useful exchange","To show that balcony gardening requires expensive equipment"],ph:"Choose one; connect the detail’s job to the passage’s point…"},
{id:14,l:2,title:"Vocabulary: let the sentence set the meaning",q:"In the sentence below, what does “reserved” most nearly mean?",text:"Although the rehearsal room buzzed with excitement, Lina remained reserved, offering only brief replies until someone asked about her music.",choices:["Enthusiastic","Set aside","Restrained","Unprepared"],ph:"Predict a substitute first; then choose and reread…"},
{id:15,l:1,title:"Agreement: hear the head noun",q:"Choose the word that correctly completes the sentence.",text:"The collection of sketches from the two classes ___ on display in the hallway.",dropdown:["is","are"],ph:"Identify the subject; justify the verb you selected…"}
];
for(const q of questions){
let prompt=`<div class="prob-head"><span class="prob-num">${q.id}</span><span class="lvl-badge lvl-${q.l}">Level ${q.l}</span></div><div class="card-question">${q.q}</div>${q.text?`<div class="sentence">${q.text}</div>`:""}${q.choices?options("q"+q.id,q.choices,q.multi):""}${q.dropdown?`<div style="margin-top:.65rem"><label for="q15-entry" class="small">Complete the sentence: </label><select id="q15-entry" aria-label="Choose the completing verb"><option value="">Choose…</option>${q.dropdown.map(x=>`<option>${x}</option>`).join("")}</select></div>`:""}${field("q"+q.id+"-work",q.ph)}`;
add(q.title,"00:02–00:17 · Independent cold redo",q.diagram?`<div class="grid2"><div class="prob-card">${prompt}</div>${q.diagram}</div>`:`<div class="prob-card">${prompt}</div>`,0);
}
add("The Trap Is the <span class='tint'>Useful Part</span>","00:17–00:20 · Selective repair, not a second lesson",`<div class="grid2"><div class="stack">${box("Explain one miss in 60 seconds","What did I do? Why was that tempting? What exact cue would make me choose a different move next time?")}${field("repair-rule","When I see ___, I will ___ because ___.")}</div><div class="grid2">${[["C · Careless","The method was sound; copying or arithmetic slipped."],["M · Misread","The task, base, sign, unit, or number of selections changed."],["G · Gap","The underlying relationship was not secure."],["T · Timing","Pace displaced a deliberate decision."],["S · Strategy","The approach or entry check did not match the task."]].map(([t,b])=>info(t,`<span class="small">${b}</span>`)).join("")}</div></div><div class="trap-card" style="margin-top:.7rem"><h3>Choose only the repair you need</h3><p>The next three screens give unfinished, step-by-step solution paths for items 3, 8, and 9. Use one or two within this three-minute debrief; skip unused paths. The student supplies the final result.</p></div>`,0);
add("Repair Path: <span class='tint'>Trade Averages for Totals</span>","00:17–00:20 · Optional guided path · Item 3 · Level 4",`<div class="grid2"><div class="stack"><div class="step"><span class="step-no">1</span><p><b>Set a fence.</b> The combined mean must lie between 16 and 21. Since more students are in the lower-scoring group, on which side of the midpoint should it lie?</p></div><div class="step"><span class="step-no">2</span><p><b>Give each student a vote.</b> Recover the group totals: <span class="math">12 × 16</span> and <span class="math">8 × 21</span>. Why would averaging 16 and 21 give the smaller group too much influence?</p></div><div class="step"><span class="step-no">3</span><p><b>Pool, then share.</b> Write <span class="math">(12 × 16 + 8 × 21) ÷ (12 + 8)</span>. Compute it yourself; check it against your fence.</p></div>${field("repair3","Final mean + why it passes your check…")}</div>${groups}</div>`,0);
add("Repair Path: <span class='tint'>Photograph the Bag Twice</span>","00:17–00:20 · Optional guided path · Item 8 · Level 4",`<div class="grid2"><div class="stack"><div class="step"><span class="step-no">1</span><p><b>Take the first photograph.</b> For the first red draw, record red counters over all counters. Is red more or less likely than blue?</p></div><div class="step"><span class="step-no">2</span><p><b>Remove the counter, not just the word.</b> After a red has been drawn, how many red counters and how many total counters remain? Fill the second bag before writing a fraction.</p></div><div class="step"><span class="step-no">3</span><p><b>Follow one path.</b> Multiply <span class="math">(3/8) × (2/7)</span>. Simplify independently. Should the result be smaller than the probability of just the first red draw?</p></div>${field("repair8","Simplified probability + magnitude check…")}</div>${draws}</div>`,0);
add("Repair Path: <span class='tint'>The Units Choose the Route</span>","00:17–00:20 · Optional guided path · Item 9 · Level 3",`<div class="grid2"><div class="stack"><div class="step"><span class="step-no">1</span><p><b>Predict the scale.</b> Twenty-five seconds is less than half a minute. The mass moved should be less than half of one minute’s mass. What rough upper bound does that give?</p></div><div class="step"><span class="step-no">2</span><p><b>Build a cancellation machine.</b> Write <span class="math">25 s × (1 min / 60 s) × (18 gal / 1 min) × (8.4 lb / 1 gal)</span>. Point to each unit that disappears.</p></div><div class="step"><span class="step-no">3</span><p><b>Compute only after landing.</b> Pounds should be the only surviving unit. Evaluate the chain and compare your result with your estimate.</p></div>${field("repair9","Final mass in pounds + estimate check…")}</div>${figure(svg(`<rect x="29" y="63" width="99" height="65" rx="12" fill="#E8EDF5" stroke="#b9c6d9"/><rect x="171" y="63" width="99" height="65" rx="12" fill="#DCEBFB" stroke="#b9c6d9"/><rect x="313" y="63" width="99" height="65" rx="12" fill="#FBEBCF" stroke="#b9c6d9"/><text x="79" y="101" text-anchor="middle" class="heavy">seconds</text><text x="221" y="101" text-anchor="middle" class="heavy">minutes</text><text x="363" y="101" text-anchor="middle" class="heavy">gallons</text><path d="M135 95 H164 M277 95 H306 M363 138 V180 H221" class="line"/><path d="M156 88 L164 95 L156 102 M298 88 L306 95 L298 102 M230 173 L221 180 L230 187" class="line"/><rect x="79" y="151" width="135" height="59" rx="12" fill="#E2E2E2" stroke="#b9c6d9"/><text x="147" y="187" text-anchor="middle" class="heavy">pounds</text><text x="220" y="240" text-anchor="middle">Every bridge unit must cancel.</text>`,"Conversion route from seconds to minutes, to gallons, and finally to pounds."),"Read the route as units, not as a sequence of numbers to multiply blindly.")}</div>`,0);
add("Blank Page. <span class='tint'>Rebuild the Tools.</span>","00:20–00:23 · Formula recall · 3 minutes",`<div class="grid2"><div>${box("Start with the picture","Which quantity measures an edge, a surface, or a filled space? What units would expose a misplaced formula?")}${field("formula-sheet","Write your formula sheet from memory before opening the recall prompts…",220)}</div><div class="stack">${info("Your retrieval checklist","Circle; triangle; parallelogram; trapezoid; prism; cylinder; angle relationships; percent change; mean; probability; counting.")}${info("The 15-minute rhythm","3 minutes blank-page recall → 6 minutes geometry → 4 minutes number/data/probability → 2 minutes rebuild the gaps.")}<div class="trap-card"><h3>Say what each symbol means</h3><p>A memorized expression without labels can still trigger the diameter trap, a slanted-height trap, or a percent-base trap.</p></div></div></div>`,1);
add("Geometry: <span class='tint'>Name the Measurement</span>","00:23–00:26 · Formula recall · Plane figures",`<div class="grid4">${figure(svg(`<circle cx="110" cy="91" r="61" fill="#F0F7FF" stroke="#4d4d4d" stroke-width="2"/><line x1="49" y1="91" x2="171" y2="91" stroke="#b9c6d9" stroke-width="2"/><line x1="110" y1="91" x2="153" y2="48" stroke="#2563eb" stroke-width="2"/><text x="139" y="81" class="heavy">r</text><text x="110" y="113" text-anchor="middle">d</text>`, "Circle with labeled radius and diameter.","0 0 220 170"),"Circle: edge length or enclosed surface?")}${figure(svg(`<path d="M28 143 L190 143 L88 30 Z" fill="#E8EDF5" stroke="#4d4d4d" stroke-width="2"/><path d="M88 30 V143" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><path d="M88 133 H98 V143" fill="none" stroke="#2563eb"/><text x="113" y="163">b</text><text x="70" y="98">h</text>`, "Triangle with a horizontal base and perpendicular height.","0 0 220 170"),"Triangle: what full figure can it pair with?")}${figure(svg(`<path d="M25 140 L165 140 L197 40 L57 40 Z" fill="#DCEBFB" stroke="#4d4d4d" stroke-width="2"/><path d="M57 40 V140 M57 130 H67 V140" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="105" y="162">b</text><text x="35" y="97">h</text>`, "Parallelogram with horizontal base and perpendicular height, not slanted side.","0 0 220 170"),"Parallelogram: move a wedge, keep the area.")}${figure(svg(`<path d="M24 140 L195 140 L150 42 L69 42 Z" fill="#FBEBCF" stroke="#4d4d4d" stroke-width="2"/><path d="M69 42 V140 M69 130 H79 V140" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="107" y="31">a</text><text x="107" y="163">b</text><text x="48" y="99">h</text>`, "Trapezoid with parallel bases a and b and perpendicular height h.","0 0 220 170"),"Trapezoid: two copies make a familiar figure.")}</div><div class="grid2" style="margin-top:.8rem"><div class="info-card"><ul class="recall-list"><li><strong>Circle: area, circumference, and r–d relationship</strong>${recall("f-circle","Circle formulas and relationship")}</li><li><strong>Triangle and parallelogram areas</strong>${recall("f-tri","Triangle and parallelogram area formulas")}</li></ul></div><div class="info-card"><ul class="recall-list"><li><strong>Trapezoid area</strong>${recall("f-trap","Trapezoid area formula")}</li><li><strong>Explain the height in all three polygons</strong>${recall("f-height","Describe perpendicular height")}</li></ul></div></div>`,1);
add("Solids + Angles: <span class='tint'>Layers and Turns</span>","00:26–00:29 · Formula recall · Space and angles",`<div class="grid2"><div class="stack">${figure(svg(`<path d="M44 62 V172 A66 22 0 0 0 176 172 V62 Z" fill="#F0F7FF" stroke="#4d4d4d" stroke-width="2"/><path d="M44 172 A66 22 0 0 1 176 172" fill="none" stroke="#b9c6d9" stroke-width="1.5" stroke-dasharray="5 4"/><ellipse cx="110" cy="62" rx="66" ry="22" fill="#DCEBFB" stroke="#4d4d4d" stroke-width="2"/><circle cx="110" cy="62" r="2.5" fill="#4d4d4d"/><line x1="110" y1="62" x2="176" y2="62" stroke="#2563eb" stroke-width="2"/><text x="139" y="54">r</text><line x1="192" y1="62" x2="192" y2="172" stroke="#2563eb" stroke-width="2"/><path d="M187 62 H197 M187 172 H197" stroke="#2563eb" stroke-width="2"/><text x="202" y="120">h</text><path d="M275 100 L363 100 L409 58 L321 58 Z" fill="#DCEBFB" stroke="#4d4d4d" stroke-width="2"/><path d="M275 100 H363 V192 H275 Z" fill="#E8EDF5" stroke="#4d4d4d" stroke-width="2"/><path d="M363 100 L409 58 V150 L363 192 Z" fill="#F0F7FF" stroke="#4d4d4d" stroke-width="2"/><path d="M275 192 L321 150 H409 M321 150 V58" fill="none" stroke="#b9c6d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="333" y="223" text-anchor="middle">prism: base area B</text>`,"Cylinder with a full elliptical top, center-to-edge radius r, and perpendicular height h beside a prism with three clearly bounded visible faces."),"Volume counts equal cross-sectional layers. Dashed edges are hidden; both solids are drawn in perspective.")}<div class="info-card"><ul class="recall-list"><li><strong>Prism and cylinder volume</strong>${recall("f-volume","Prism and cylinder volume formulas")}</li><li><strong>What is a base? What unit does volume use?</strong>${recall("f-base","Base definition and volume units")}</li></ul></div></div><div class="info-card"><ul class="recall-list"><li><strong>Triangle interior sum; n-sided polygon interior sum</strong>${recall("f-polygon","Triangle and polygon angle sums")}</li><li><strong>Angles on a straight line; a full turn</strong>${recall("f-turn","Straight angle and full turn")}</li><li><strong>Parallel lines: corresponding and alternate interior pairs</strong>${recall("f-parallel","Parallel line angle relationships")}</li><li><strong>Same-side interior angles; vertical angles</strong>${recall("f-vertical","Same-side interior and vertical relationships")}</li></ul><div class="trap-card" style="margin-top:.6rem"><h3>Test the condition, not the picture</h3><p>Which angle relationships require parallel lines? Which do not? How would you know if a slanted edge is not the solid’s height?</p></div></div></div>`,1);
add("Number Tools: <span class='tint'>Restore the Relationship</span>","00:29–00:33 · Formula recall · Number, data, chance",`<div class="grid2"><div class="info-card"><ul class="recall-list"><li><strong>Percent change: name the denominator</strong>${recall("f-percent","Percent change relationship")}</li><li><strong>Increase/decrease multipliers; successive changes</strong>${recall("f-mult","Percent multipliers and successive changes")}</li><li><strong>Mean, sum, count; two-group mean</strong>${recall("f-mean","Mean and weighted mean relationships")}</li><li><strong>Median: even count, sorted data, frequency</strong>${recall("f-median","Median method")}</li></ul></div><div class="info-card"><ul class="recall-list"><li><strong>P(at least one): what is the complementary event?</strong>${recall("f-complement","At least one probability relationship")}</li><li><strong>Without replacement: what changes after a draw?</strong>${recall("f-without","Without replacement relationship")}</li><li><strong>Arrangements versus selections: does order create a new outcome?</strong>${recall("f-counting","Arrangement and selection distinction")}</li><li><strong>For distinct roles with no repeats, write the choice counts</strong>${recall("f-roles","Multiplication counting method")}</li></ul></div></div><div class="prompt-box" style="margin-top:.7rem"><h3>A formula is a compressed story</h3><p>Tell the story in plain language before naming the symbols. For counting, list a tiny case: does switching the same people produce a different assignment or merely the same group?</p></div>`,1);

const passage=`<p><span class="para">[1]</span>Mara had spent three Saturdays repairing the hand-lettered signs for her grandfather’s neighborhood shop. She had traced the faded letters precisely, even copying a crooked curl on the word “Repairs.” When he announced that the signs would be replaced by a single printed board, she slid her brush into its jar with more force than necessary. “The old ones still tell people where to come,” she said.</p>
<p><span class="para">[2]</span>Her grandfather opened a drawer and lifted out a sign she had never seen. Its paint was cracked, and one corner had been clipped away. “Your grandmother made this when we had only one window,” he said. “I kept it when we put up the signs you know.” Mara studied the clipped corner. For the first time, the shop’s familiar lettering seemed less like a permanent feature of the street and more like one choice in a long series of choices.</p>
<p><span class="para">[3]</span>He asked her to carry the new board outside. She expected something bright and impersonal. Instead, the letters were quiet, almost plain, with enough space between them to be read from the bus stop. A man across the street paused, read the board, and pointed toward a broken buckle on his bag. Her grandfather raised a hand in reply. Mara held the board a little higher.</p>
<p><span class="para">[4]</span>Back inside, she began gathering the old signs. Her grandfather reached for the largest, but she asked him to wait. From a sheet of paper, she cut small labels and wrote the dates she could remember beneath each one. Where she could not remember, she left a space. “We could ask Mrs. Ortiz,” she said. “She’s been coming here longer than I have.”</p>
<p><span class="para">[5]</span>By closing time, the signs rested on a shelf above the workbench, not facing the street but still easy to see. Mara set her brush beside them. There would be no more letters to trace that afternoon. Tomorrow, however, she would bring a notebook. The shop had acquired a clearer name for people passing outside; she wanted to find out how many names it had carried for those already inside.</p>`;

window.initParticles = function(canvas, opts) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const count = opts.count || 40;
  let mx = -1000, my = -1000;
  const [r, g, b] = [37, 99, 235];
  let particles = [];
  function seed() {
    const w = canvas.offsetWidth || window.innerWidth;
    const h = canvas.offsetHeight || window.innerHeight;
    canvas.width = w; canvas.height = h;
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3,
      size: Math.random() * 2.2 + .7, alpha: Math.random() * .28 + .08
    }));
  }
  seed(); requestAnimationFrame(seed); window.addEventListener('resize', seed);
  canvas.addEventListener('mousemove', e => { const rc = canvas.getBoundingClientRect(); mx = e.clientX - rc.left; my = e.clientY - rc.top; });
  const ownSlide = canvas.closest('.slide');
  (function animate() {
    if (!ownSlide || ownSlide.classList.contains('active')) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        const dx = p.x - mx, dy = p.y - my, dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) { const f = (120-dist)/120*1.5; p.vx += (dx/dist)*f*.1; p.vy += (dy/dist)*f*.1; }
        p.vx *= .98; p.vy *= .98; p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + p.alpha + ')'; ctx.fill();
      });
    }
    requestAnimationFrame(animate);
  })();
};
document.querySelectorAll('.particle-canvas').forEach(c => window.initParticles(c, { count: 55 }));
</script>
