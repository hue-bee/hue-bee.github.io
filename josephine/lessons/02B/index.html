<style>
.particle-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
@media print{.particle-canvas{display:none!important}}
/*
Art direction: supplied presentation template.
Cool blue background, white cards, gray section colors,
blue/amber difficulty badges, Baloo 2 headings, Nunito body.
All practice content is original. No automatic scoring is included.
*/

:root{
  --bg:#F0F7FF;
  --surface:#FFFFFF;
  --ink:#1F1F1F;
  --ink-2:#4A4A4A;
  --ink-3:#767676;
  --line:rgba(201,212,228,.45);
  --pink:#2563EB;
  --pink-soft:#DCEBFB;
  --amber:#B45309;
  --amber-soft:#FBEBCF;
  --z1:#262626;
  --z2:#4D4D4D;
  --z3:#6A6A6A;
  --soft:#EFEFEF;
  --font-display:"Baloo 2","Nunito",sans-serif;
  --font-body:"Nunito",sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:var(--font-body);
  font-weight:400;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,
summary:focus-visible,a:focus-visible{
  outline:3px solid var(--pink);
  outline-offset:3px;
}
button:disabled{cursor:default;opacity:.48}

.deck{
  width:100vw;
  height:calc(100dvh - 84px);
  position:relative;
}
.slide{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.97);
  transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;
}
.slide.active{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}
.content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:1100px;
  padding:clamp(16px,2.5vw,36px);
  flex-shrink:0;
  transform-origin:center;
}
.gradient-mesh{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.blob{
  position:absolute;
  width:340px;
  height:340px;
  border-radius:50%;
  background:#C9D4E4;
  filter:blur(75px);
  opacity:.13;
  animation:drift 14s ease-in-out infinite;
}
.blob:first-child{right:-90px;top:-100px}
.blob:nth-child(2){
  left:-90px;bottom:-100px;
  background:#B7BFCD;
  animation-delay:-5s;
  animation-duration:18s;
}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(30px,-22px) scale(1.08)}
}
@keyframes heroFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.reveal{animation:enter .4s ease both}
@keyframes enter{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.slide.active .reveal:nth-child(2){animation-delay:.04s}
.slide.active .reveal:nth-child(3){animation-delay:.08s}

.kicker{
  margin-bottom:5px;
  font-size:12px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.13em;
  color:var(--ink-3);
}
h1,h2,h3,p{margin-top:0}
h1,h2{
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:-.015em;
  line-height:1.12;
}
h1{font-size:clamp(34px,4.8vw,58px);margin-bottom:12px}
h2{font-size:clamp(26px,3.1vw,38px);margin-bottom:18px}
h3{font-size:18px;margin-bottom:8px;font-weight:800}
p,li{font-size:17px;line-height:1.48}
p:last-child{margin-bottom:0}
ul,ol{margin:8px 0 0;padding-left:22px}
li+li{margin-top:9px}
.tint{color:var(--pink)}
.muted{color:var(--ink-2)}
.small{font-size:14px;line-height:1.45;color:var(--ink-3)}
.tiny{font-size:12px;line-height:1.4;color:var(--ink-3)}
.center{text-align:center}
.subhead{font-size:20px;color:var(--ink-2);line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stack{display:grid;gap:14px}
.card,.passage-card,.diagram-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:0 10px 24px rgba(201,212,228,.20),
             0 2px 6px rgba(201,212,228,.13);
}
.soft-card{
  background:#EDF2F9;
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
}
.rule{
  margin-top:16px;
  padding:12px 16px;
  background:#F1F6FD;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:16px;
  line-height:1.45;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:24px;
  padding:5px 11px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  background:#FFFFFF;
  border:1px solid var(--line);
}
.zone-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.zone-chip{
  padding:4px 10px;
  border-radius:24px;
  background:#FFFFFF;
  border:1px solid var(--line);
  color:var(--ink-3);
  font-size:11px;
  font-weight:700;
}
.zone-chip.on{background:#3E3E3E;border-color:#3E3E3E;color:#FFFFFF}

.prob-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prob-num{
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  background:#EDF2F9;
  padding:2px 10px;
  border-radius:8px;
}
.lvl-badge{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.07em;
  padding:4px 8px;
  border-radius:24px;
}
.lvl-1{background:#E8EDF5;color:#3D4C63}
.lvl-2{background:#DCEBFB;color:#1D4ED8}
.lvl-3{background:#FBEBCF;color:#854009}
.lvl-4{background:#E2E2E2;color:#3D3D3D}
.question-stem{
  font-size:16px;
  line-height:1.43;
  margin-bottom:12px;
}
.options{display:grid;gap:6px}
.option{
  display:grid;
  grid-template-columns:21px 1fr;
  gap:7px;
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  border-radius:9px;
  background:#FBFCFE;
  color:var(--ink-2);
  padding:8px 10px;
  font-size:14px;
  line-height:1.35;
  transition:background .15s,border-color .15s;
}
.option:hover{background:#F1F6FD}
.option.selected{
  background:#DCEBFB;
  border-color:#2563EB;
  color:#17233B;
}
.opt-letter{font-weight:800;color:#505B6B}
.selection-note{font-size:12px;color:var(--ink-3);margin-top:9px}
.response-field,.plan-input{
  width:100%;
  border:1px dashed #B9C6D9;
  background:#F9FBFE;
  border-radius:10px;
  padding:11px 12px;
  color:var(--ink);
  font-weight:700;
}
.scratch{
  width:100%;
  resize:none;
  height:60px;
  border:1px dashed #B9C6D9;
  border-radius:10px;
  background:#F9FBFE;
  padding:10px 12px;
  margin-top:10px;
  color:var(--ink-2);
  font-size:15px;
}
.btn{
  min-height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#FFFFFF;
  color:var(--ink);
  padding:8px 13px;
  font-size:14px;
  font-weight:800;
}
.btn:hover{background:#F1F6FD}
.btn.primary{background:#3D3D3D;color:#FFFFFF;border-color:#3D3D3D}
.btn.primary:hover{background:#242424}
.button-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
details{
  margin-top:12px;
  border:1px solid var(--line);
  background:#F1F6FD;
  border-radius:10px;
  padding:10px 12px;
}
summary{cursor:pointer;font-size:14px;font-weight:800}
details p{font-size:14px;margin:10px 0 0;line-height:1.45}

.passage-card{padding:19px 22px}
.passage-card p{
  font-size:16px;
  line-height:1.48;
  color:var(--ink-2);
  margin-bottom:12px;
}
.passage-card .para{
  display:inline-block;
  min-width:25px;
  color:var(--ink-3);
  font-weight:800;
  font-size:12px;
}
.passage-title{
  font-family:var(--font-display);
  font-size:23px;
  font-weight:600;
  margin-bottom:12px;
}
.passage-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
  align-items:center;
}
.mark-target::selection{background:#F6D18B}
mark.user-mark{background:#F6D18B;border-radius:3px;padding:0 1px}
.reading-note{font-size:13px;color:var(--ink-3)}
.diagram-wrap{display:flex;align-items:center;justify-content:center}
.diagram-wrap svg{
  display:block;width:100%;height:auto;max-height:310px;
}
svg text{font-family:var(--font-body);fill:var(--ink-2)}
.hero-graphic{
  max-width:450px;
  margin:0 auto 18px;
  animation:heroFloat 5s ease-in-out infinite;
}
.hero-graphic svg{width:100%;height:auto}
.route-row{
  display:grid;
  grid-template-columns:85px 15px 1fr;
  gap:12px;
  align-items:stretch;
}
.route-time{font-weight:800;font-size:18px;padding-top:15px;text-align:right}
.route-rail{position:relative}
.route-rail:before{
  content:"";position:absolute;left:6px;top:0;bottom:0;
  width:2px;background:var(--line);
}
.route-dot{
  position:relative;display:block;margin-top:19px;
  width:14px;height:14px;border-radius:50%;
  background:#555;border:3px solid var(--bg);
}
.route-row .card{margin-bottom:12px}
.route-row h3{margin-bottom:5px}
.route-row p{font-size:15px}
.source-note{font-size:11px;color:var(--ink-3);margin-top:13px}
.source-note a{color:inherit;text-underline-offset:3px}
.math{font-weight:800;font-size:20px;line-height:1.45}
.math-small{font-weight:800;font-size:17px}
.slot-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.slot{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  border:2px solid #B9C6D9;border-radius:12px;
  background:#F9FBFE;min-height:102px;
}
.slot strong{font-size:28px}
.slot span{font-size:12px;color:var(--ink-3)}
.sample-table{width:100%;border-collapse:separate;border-spacing:5px}
.sample-table th{font-size:15px;font-weight:800;padding:9px}
.sample-table td{
  background:#F9FBFE;border:1px solid var(--line);
  border-radius:8px;text-align:center;padding:6px;
}
.sample-table input{
  width:100%;min-width:0;height:40px;text-align:center;
  background:transparent;border:0;font-size:18px;color:var(--ink);
}
.review-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review-item{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:center;background:#FFFFFF;
  border:1px solid var(--line);border-radius:10px;padding:13px;
}
.review-item strong{font-size:17px}
.review-response{display:block;font-size:13px;color:var(--ink-3);margin-top:4px}
.status-message{min-height:22px;font-size:14px;color:var(--ink-2);margin-top:12px}
.closed-panel{
  text-align:center;background:#FFFFFF;border:1px solid var(--line);
  border-radius:14px;padding:50px 24px;
}
.closed-panel h3{font-family:var(--font-display);font-size:30px}
.plan-field{display:block;font-size:14px;font-weight:800;margin-bottom:11px}
.plan-field input{margin-top:6px}
.number-line{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-top:16px;
}
.number-line div{
  background:#FFFFFF;border:1px solid var(--line);
  border-radius:10px;padding:13px;text-align:center;
}
.number-line strong{font-size:22px;display:block}
.number-line span{font-size:12px;color:var(--ink-3)}

.nav-controls{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;z-index:100;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  padding:7px 15px;border-radius:40px;border:1px solid var(--line);
  box-shadow:0 10px 28px rgba(201,212,228,.32),
             0 2px 8px rgba(201,212,228,.18);
}
.nav-btn{
  flex-shrink:0;width:40px;height:40px;border:0;
  background:#F1F6FD;color:var(--ink);
  border-radius:50%;font-size:26px;
  display:flex;align-items:center;justify-content:center;
}
.nav-btn:hover{background:#DCE7F7}
.slide-dots{display:flex;gap:0;align-items:center}
.dot{
  width:18px;height:30px;padding:0;border:0;
  background:transparent;display:flex;align-items:center;justify-content:center;
}
.dot:after{
  content:"";width:7px;height:7px;border-radius:50%;
  background:rgba(0,0,0,.18);
}
.dot.active:after{background:var(--ink);transform:scale(1.35)}
.slide-counter{
  font-size:12px;color:var(--ink-3);
  min-width:43px;text-align:center;font-weight:700;
}
.clock{
  position:fixed;top:11px;right:14px;z-index:70;
  display:flex;align-items:center;gap:8px;
  color:var(--ink-3);font-size:12px;
}
.clock button{
  background:#FFFFFF;border:1px solid var(--line);
  border-radius:20px;padding:5px 10px;font-size:12px;font-weight:800;
}
.clock-time{font-variant-numeric:tabular-nums}
dialog{
  width:min(920px,calc(100vw - 28px));
  max-height:calc(100dvh - 32px);
  border:1px solid var(--line);border-radius:16px;
  background:var(--bg);padding:22px;color:var(--ink);
}
dialog::backdrop{background:rgba(28,33,45,.38);backdrop-filter:blur(4px)}
.dialog-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;margin-bottom:12px;
}
.dialog-head h2{font-size:27px;margin:0}
.dialog-body{transform-origin:top center}
#confirmDialog{max-width:560px}
#confirmDialog p{font-size:16px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;

@media(max-width:700px){
  .grid2,.grid3{grid-template-columns:1fr}
  .content{padding:18px}
  h2{font-size:27px;margin-bottom:12px}
  p,li{font-size:16px}
  .card{padding:14px}
  .question-stem{font-size:15px}
  .option{font-size:13px;padding:7px 9px}
  .grid2.question-grid{gap:10px}
  .question-grid .card{padding:12px}
  .passage-card p{font-size:15px}
  .nav-controls{gap:5px;padding:6px 9px;bottom:10px}
  .dot{width:17px}
  .nav-btn{width:38px;height:38px}
  .slide-counter{min-width:39px}
  .clock{top:7px;right:9px}
  .review-list{grid-template-columns:1fr 1fr}
  .hero-graphic{max-width:310px}
  .number-line{grid-template-columns:repeat(2,1fr)}

  *,*:before,*:after{
    animation:none!important;transition:none!important;

}

  body{height:auto;overflow:visible;background:white}
  .deck{height:auto;width:100%}
  .slide{
    position:relative;opacity:1;transform:none;
    pointer-events:auto;min-height:190mm;
    page-break-after:always;
  }
  .content{transform:none!important;width:100%!important}
  .nav-controls,.clock,.gradient-mesh,dialog{display:none!important}
  .reveal{opacity:1;animation:none}

.latex-math, mjx-container { background:transparent!important; box-shadow:none!important; }
.latex-math { font-weight:400; }
.math-small, .math { background:transparent; }
.soft-card.center:has(.latex-math) { background:transparent; }
mjx-container svg { max-height:none!important; }
</style>

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']] },
  svg: { fontCache: 'local' },
  startup: {
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => {
        // Typeset the numeric diagram labels in the same TeX font.
        document.querySelectorAll('.diagram-wrap svg text').forEach(label => {
          const text=label.textContent;
          if(!/\d/.test(text))return;
          const tex=text.split(/(\d+)/).map(part=>/^\d+$/.test(part)?part:'\\text{'+part+'}').join('');
          const rendered=MathJax.tex2svg(tex).querySelector('svg');
          const vb=rendered.getAttribute('viewBox').split(/\s+/).map(Number);
          const size=Number(label.getAttribute('font-size')||17);
          const scale=size/1000;
          const x=Number(label.getAttribute('x')||0),y=Number(label.getAttribute('y')||0);
          const width=vb[2]*scale;
          const anchor=label.getAttribute('text-anchor');
          const left=x-(anchor==='middle'?width/2:anchor==='end'?width:0);
          rendered.setAttribute('x',left);
          rendered.setAttribute('y',y+vb[1]*scale);
          rendered.setAttribute('width',width);
          rendered.setAttribute('height',vb[3]*scale);
          rendered.style.overflow='visible';
          rendered.setAttribute('aria-label',text);
          label.replaceWith(rendered);
        });
        window.dispatchEvent(new Event('resize'));
      });
    }
  }
};
</script>

<script>
"use strict";

/* Original passages. Paragraph numbering remains stable in every view. */
const passages={
  N:{
    title:"The Repair Shelf",
    paragraphs:[
      "Mara proposed a repair shelf at the neighborhood library: visitors could leave damaged books with a note, and volunteers would try to mend them. Staff hoped the shelf would keep usable books out of the discard bin.",
      "During the first week, volunteers repaired eighteen books and discarded six. Fourteen books had been discarded the week before. Mara was ready to declare the shelf a success. The librarian pointed out that the new week included unusually sturdy hardcovers, while the earlier week included many water-damaged paperbacks. The totals described different mixtures of books.",
      "The team began recording damage types before comparing weeks. Volunteers also timed each repair, since saving a single book might require an hour of work. Their notes connected the number of books saved to the effort needed to save them.",
      "The librarian's support for the shelf remained qualified. She favored keeping it, but wanted several comparable weeks before claiming that it reduced waste efficiently. Her caution did not make the project useless; it made the claim narrower and more defensible."
    ]
  },
  F:{
    title:"The Blank Label",
    paragraphs:[
      "Before the community exhibit opened, Lena aligned a printed label beside each of her grandfather's repaired clocks. One brass clock had no date. She left a blank card beneath it and moved on. A display, she thought, should explain itself without anyone having to ask.",
      "Her grandfather arrived carrying a small tin of screws. When Lena asked for the missing year, he studied the clock but shook his head. “I remember who brought it,” he said. A neighbor had carried it through rain after finding it in a flooded cellar. He described drying each gear on the kitchen table. Lena glanced toward the doors; the first visitors were already gathering.",
      "“We need something for the card,” she said. Instead of naming a year, he wound the clock. Its first tick was uneven, then settled. Lena remembered that sound behind her childhood conversations at his workbench. She set down her pen.",
      "When a visitor stopped at the brass clock, Lena did not apologize for the empty label. She asked her grandfather to tell the cellar story again. The card remained blank, but she moved it aside so that the visitor could see the small patch of repaired metal."
    ]
  }
};

/* Teaching levels are instructional labels, not official adaptive difficulty parameters. */
const questions={
  N1:{
    level:1,
    stem:'As used in paragraph 4, “qualified” most nearly means',

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function passageHTML(key){
  const p=passages[key];
  return `<article class="passage-card mark-target">
    <div class="passage-title">${p.title}</div>
    ${p.paragraphs.map((text,i)=>`<p><span class="para">[${i+1}]</span>${text}</p>`).join("")}
    <div class="reading-note">Original practice passage · paragraph numbers remain fixed.</div>
  </article>`;
}

function passageTools(key){
  return `<div class="passage-tools">
    <button class="btn" type="button" data-passage="${key}">Open full passage</button>
    <span class="small">Use the passage freely before submitting its set.</span>
  </div>`;
}


function latexInline(tex){
  return '<span class="latex-math">\\(' + escapeHTML(tex) + '\\)</span>';
}
function mathText(text, labels=false){
  const pattern=labels ? /\{\d+(?:,\s*\d+)*\}|\b\d+(?:\.\d+)?(?:\/\d+)?\b|\b[A-F]\b/g
                       : /\{\d+(?:,\s*\d+)*\}|\b\d+(?:\.\d+)?(?:\/\d+)?\b/g;
  return text.replace(pattern, token=>{
    if(token.startsWith('{'))return latexInline('\\{' + token.slice(1,-1) + '\\}');
    if(token.includes('/')){const [a,b]=token.split('/');return latexInline('\\frac{'+a+'}{'+b+'}');}
    return latexInline(token);
  });
}

function questionHTML(id){
  const q=questions[id];
  return `<article class="card question-card" data-question-card="${id}">
    <div class="prob-head">
      <span class="prob-num">${id}</span>
      <span class="lvl-badge lvl-${q.level}">Level ${q.level}</span>
    </div>
    <div class="question-stem">${mathText(q.stem,id.startsWith("M"))}</div>
    ${q.mode==="entry"
      ? `<label class="small" for="entry-${id}">Your response</label>
         <input class="response-field" id="entry-${id}" data-entry="${id}"
          type="text" inputmode="text" autocomplete="off" placeholder="Reduced fraction">`
      : `<div class="options" role="group" aria-label="${id} response choices">
         ${q.options.map((opt,i)=>`<button class="option" type="button"
           data-question="${id}" data-option="${i}" aria-pressed="false">
           <span class="opt-letter">${String.fromCharCode(65+i)}</span>
           <span>${id.startsWith("M")?mathText(opt,true):opt}</span>
         </button>`).join("")}</div>`
    }
    <div class="selection-note" data-selection-note="${id}">
      ${q.mode==="multi"?"Select exactly two.":q.mode==="entry"?"Check the requested representation.":"Select one response."}
      No correctness feedback is shown.
    </div>
  </article>`;
}

function lens(title,text){
  return `<details><summary>${title}</summary><p>${text}</p></details>`;
}

function scratch(label="Record a plan or a check, not a long solution."){
  return `<textarea class="scratch" aria-label="${escapeHTML(label)}" placeholder="${escapeHTML(label)}"></textarea>`;
}

function officialNote(){
  return `<div class="source-note">
    Format guidance:
    <a href="https://www.schools.nyc.gov/learning/testing/specialized-high-school-admissions-test"
      target="_blank" rel="noopener noreferrer">NYC Public Schools SHSAT information</a>.
    Classroom timing targets are personal strategy choices, not official section limits.
  </div>`;
}

function closedHTML(){
  return `<div class="closed-panel">
    <h3>Passage set submitted</h3>
    <p>The passage and its questions are now closed in this rehearsal.</p>
    <p class="small">Continue with the presentation. No score or correctness feedback is displayed.</p>
  </div>`;
}

/* Build the deck. */
const deck=document.getElementById("deck");
deck.innerHTML=slidesData.map((s,i)=>`
  <section class="slide ${i===0?"active":""}" data-slide="${i+1}"
    data-minutes="${s.minutes}" aria-label="Slide ${i+1}: ${escapeHTML(s.title)}"
    aria-hidden="${i===0?"false":"true"}">
    ${i===0||i===slidesData.length-1?'<canvas class="particle-canvas" aria-hidden="true"></canvas>':""}
    <div class="gradient-mesh" aria-hidden="true"><div class="blob"></div><div class="blob"></div></div>
    <div class="content">
      ${s.cover?"":`
        <div class="zone-strip reveal">
          <span class="zone-chip ${s.zone===1?"on":""}">ELA · 0–25</span>
          <span class="zone-chip ${s.zone===2?"on":""}">Math · 25–45</span>
          <span class="zone-chip ${s.zone===3?"on":""}">Strategy · 45–60</span>
        </div>
        <div class="kicker reveal">Session 18 · minutes ${s.minutes}</div>
        <h2 class="reveal">${s.title}</h2>
      `}
      ${s.body}
    </div>
  </section>
`).join("");

const slideElements=[...document.querySelectorAll(".slide")];
const total=slideElements.length;
let current=1;
const dots=document.getElementById("dots");
const counter=document.getElementById("counter");

for(let i=1;i<=total;i++){
  const d=document.createElement("button");
  d.type="button";
  d.className="dot"+(i===1?" active":"");
  d.setAttribute("aria-label",`Go to slide ${i}: ${slidesData[i-1].title}`);
  d.addEventListener("click",()=>goToSlide(i));
  dots.appendChild(d);
}
slideElements.forEach((s,i)=>{s.inert=i!==0;});

function updateNav(){
  const maxDots=innerWidth<580?7:innerWidth<950?15:total;
  let lo=Math.max(1,current-Math.floor(maxDots/2));
  let hi=Math.min(total,lo+maxDots-1);
  lo=Math.max(1,hi-maxDots+1);
  [...dots.children].forEach((d,i)=>{
    const n=i+1;
    d.hidden=n<lo||n>hi;
    d.style.display=d.hidden?"none":"flex";
    d.classList.toggle("active",n===current);
    if(n===current)d.setAttribute("aria-current","step");
    else d.removeAttribute("aria-current");
  });
  counter.textContent=`${current} / ${total}`;
}

function fitSlide(slide){
  if(!slide)return;
  const c=slide.querySelector(".content");
  c.style.transform="";
  const available=deck.clientHeight-12;
  const h=c.offsetHeight;
  const scale=Math.min(1,available/h);
  if(scale<1)c.style.transform=`scale(${scale})`;
}

function goToSlide(n){
  n=Math.max(1,Math.min(total,Number(n)));
  if(!Number.isFinite(n))return;
  const previous=slideElements[current-1];
  const next=slideElements[n-1];
  previous.classList.remove("active");
  previous.setAttribute("aria-hidden","true");
  previous.inert=true;
  next.classList.add("active");
  next.setAttribute("aria-hidden","false");
  next.inert=false;
  current=n;
  updateNav();
  renderReview();
  requestAnimationFrame(()=>fitSlide(next));
}
function changeSlide(direction){
  let n=current+direction;
  if(n<1)n=total;
  if(n>total)n=1;
  goToSlide(n);
}
document.getElementById("prev").addEventListener("click",()=>changeSlide(-1));
document.getElementById("next").addEventListener("click",()=>changeSlide(1));

const editable=el=>el.closest("input,textarea,select,[contenteditable=true]");
document.addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]")||editable(e.target))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){
    e.preventDefault();changeSlide(1);
  }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){
    e.preventDefault();changeSlide(-1);
  }
  if(e.key==="Home"){e.preventDefault();goToSlide(1);}
  if(e.key==="End"){e.preventDefault();goToSlide(total);}
});

let touchStart=null;
document.addEventListener("touchstart",e=>{
  if(editable(e.target)||e.target.closest("button,dialog"))return;
  touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!touchStart)return;
  const dx=touchStart.x-e.changedTouches[0].clientX;
  const dy=touchStart.y-e.changedTouches[0].clientY;
  if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)changeSlide(dx>0?1:-1);
  touchStart=null;
},{passive:true});

/* Response selections: selection state only, never correctness. */
function updateQuestion(id){
  const q=questions[id];
  const selected=state.responses[id];
  document.querySelectorAll(`[data-question="${id}"]`).forEach(btn=>{
    const i=Number(btn.dataset.option);
    const on=Array.isArray(selected)&&selected.includes(i);
    btn.classList.toggle("selected",on);
    btn.setAttribute("aria-pressed",String(on));
  });
  document.querySelectorAll(`[data-selection-note="${id}"]`).forEach(el=>{
    if(q.mode==="entry"){
      el.textContent="Check the requested representation. No correctness feedback is shown.";
    }else if(q.mode==="multi"){
      el.textContent=`${Array.isArray(selected)?selected.length:0} of ${q.required} selected. No correctness feedback is shown.`;
    }else{
      el.textContent=Array.isArray(selected)&&selected.length
        ?"Response recorded. No correctness feedback is shown."
        :"Select one response. No correctness feedback is shown.";
    }
  });
}

function responseComplete(id){
  const q=questions[id],r=state.responses[id];
  if(q.mode==="entry")return typeof r==="string"&&r.trim().length>0;
  if(!Array.isArray(r))return false;
  return q.mode==="multi"?r.length===q.required:r.length===1;
}

function responseText(id){
  const r=state.responses[id];
  if(!Array.isArray(r)||!r.length)return "No selection yet";
  return "Selected: "+r.slice().sort((a,b)=>a-b).map(i=>String.fromCharCode(65+i)).join(", ");
}

function renderReview(){
  const box=document.getElementById("fictionReview");
  if(!box||state.fictionSubmitted)return;
  const targets={F1:10,F2:10,F3:11,F4:11};
  box.innerHTML=["F1","F2","F3","F4"].map(id=>`
    <div class="review-item">
      <div><strong>${id}</strong><span class="review-response">${responseText(id)}</span></div>
      <button class="btn" type="button" data-go="${targets[id]}">Review</button>
    </div>
  `).join("");
}

document.addEventListener("click",e=>{
  const option=e.target.closest("[data-question]");
  if(option){
    const id=option.dataset.question;
    if(id.startsWith("F")&&state.fictionSubmitted)return;
    const q=questions[id],i=Number(option.dataset.option);
    let selections=Array.isArray(state.responses[id])?[...state.responses[id]]:[];
    if(q.mode==="multi"){
      selections=selections.includes(i)
        ?selections.filter(x=>x!==i)
        :[...selections,i];
    }else selections=[i];
    state.responses[id]=selections;
    updateQuestion(id);
    renderReview();
    return;
  }

  const jump=e.target.closest("[data-go]");
  if(jump){goToSlide(Number(jump.dataset.go));return;}

  const passageButton=e.target.closest("[data-passage]");
  if(passageButton){openPassage(passageButton.dataset.passage);return;}

  const action=e.target.closest("[data-action]")?.dataset.action;
  if(!action)return;

  if(action==="close-passage")document.getElementById("passageDialog").close();
  if(action==="cancel-submit")document.getElementById("confirmDialog").close();

  if(action==="request-submit"){
    const incomplete=["F1","F2","F3","F4"].filter(id=>!responseComplete(id));
    const status=document.getElementById("setStatus");
    if(incomplete.length){
      status.textContent="Complete the response directions for: "+incomplete.join(", ")+".";
      return;
    }
    document.getElementById("confirmDialog").showModal();
  }

  if(action==="confirm-submit"){
    state.fictionSubmitted=true;
    document.getElementById("confirmDialog").close();
    document.querySelectorAll(".fiction-content").forEach(el=>{el.innerHTML=closedHTML();});
    goToSlide(13);
  }

  if(action==="lock-plan")lockPlan();
  if(action==="mark-selection")highlightSelection();
});

document.addEventListener("input",e=>{
  const entry=e.target.closest("[data-entry]");
  if(entry){
    state.responses[entry.dataset.entry]=entry.value;
    updateQuestion(entry.dataset.entry);
  }
  const plan=e.target.closest("[data-plan]");
  if(plan&&!state.planLocked){
    const key=plan.dataset.plan;
    state.plan[key]=plan.value;
    document.querySelectorAll(`[data-plan="${key}"]`).forEach(input=>{
      if(input!==plan)input.value=plan.value;
    });
  }
});

function openPassage(key){
  if(key==="F"&&state.fictionSubmitted)return;
  const dialog=document.getElementById("passageDialog");
  document.getElementById("passageDialogTitle").textContent=passages[key].title;
  const body=document.getElementById("passageDialogBody");
  body.innerHTML=passageHTML(key);
  body.style.transform="";
  dialog.showModal();
  requestAnimationFrame(()=>{
    const header=dialog.querySelector(".dialog-head").offsetHeight;
    const available=innerHeight-header-100;
    const natural=body.offsetHeight;
    if(natural>available){
      const scale=available/natural;
      body.style.transform=`scale(${scale})`;
      body.style.marginBottom=`-${natural*(1-scale)}px`;
    }else body.style.marginBottom="0";
  });
}

function highlightSelection(){
  const selection=window.getSelection();
  if(!selection||selection.isCollapsed||!selection.rangeCount)return;
  const range=selection.getRangeAt(0);
  const parent=range.commonAncestorContainer.nodeType===1
    ?range.commonAncestorContainer:range.commonAncestorContainer.parentElement;
  if(!parent.closest(".mark-target"))return;
  const mark=document.createElement("mark");
  mark.className="user-mark";
  try{range.surroundContents(mark);selection.removeAllRanges();}
  catch(_){
    /* Cross-paragraph selections are deliberately left unchanged. */
  }
}

function lockPlan(){
  const status=document.getElementById("planStatus");
  const p=state.plan;
  const math=Number(p.mathMinutes),ela=Number(p.elaMinutes);
  if(!p.mathMinutes||!p.elaMinutes||math<=0||ela<=0||math+ela!==180){
    status.textContent="Confirm positive section budgets totaling 180 minutes before locking.";
    return;
  }
  if(!p.elaCheckpoint.trim()||!p.resetPhrase.trim()){
    status.textContent="Record the rehearsed ELA checkpoint and reset phrase before locking.";
    return;
  }
  state.planLocked=true;
  document.querySelectorAll("[data-plan]").forEach(input=>{input.readOnly=true;});
  document.querySelectorAll('[data-action="lock-plan"]').forEach(btn=>{
    btn.disabled=true;btn.textContent="Plan locked";
  });
  status.textContent="Plan recorded for this browser session. Keep the established sequence; no late redesign.";
}

/* Timer is a lesson pacing aid; it does not force slide changes. */
let timerRunning=false,elapsed=0,lastTick=0;
const clockTime=document.getElementById("clockTime");
const clockToggle=document.getElementById("clockToggle");

clockToggle.addEventListener("click",()=>{
  timerRunning=!timerRunning;
  lastTick=Date.now();
  clockToggle.textContent=timerRunning?"Pause":"Resume";
});

setInterval(()=>{
  const now=Date.now();
  if(timerRunning)elapsed+=now-lastTick;
  lastTick=now;
  const seconds=Math.floor(elapsed/1000);
  clockTime.textContent=
    String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
},250);

document.querySelectorAll("details").forEach(d=>{
  d.addEventListener("toggle",()=>fitSlide(slideElements[current-1]));
});
window.addEventListener("resize",()=>{
  updateNav();fitSlide(slideElements[current-1]);
});
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(()=>fitSlide(slideElements[current-1]));
}
renderReview();
updateNav();
requestAnimationFrame(()=>fitSlide(slideElements[0]));
</script>
<script>
window.initParticles = function(canvas, opts) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const count = opts.count || 40;
  let mx = -1000, my = -1000;
  const [r, g, b] = [37, 99, 235];
  let particles = [];
  function seed() {
    const w = canvas.offsetWidth || window.innerWidth;
    const h = canvas.offsetHeight || window.innerHeight;
    canvas.width = w; canvas.height = h;
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3,
      size: Math.random() * 2.2 + .7, alpha: Math.random() * .28 + .08
    }));
  }
  seed(); requestAnimationFrame(seed); window.addEventListener('resize', seed);
  const ownSlide = canvas.closest('.slide');
  const pointerTarget = ownSlide || canvas;
  pointerTarget.addEventListener('mousemove', e => { const rc = canvas.getBoundingClientRect(); mx = (e.clientX - rc.left) * canvas.width / rc.width; my = (e.clientY - rc.top) * canvas.height / rc.height; });
  pointerTarget.addEventListener('mouseleave', () => { mx = -1000; my = -1000; });
  (function animate() {
    if (!ownSlide || ownSlide.classList.contains('active')) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        const dx = p.x - mx, dy = p.y - my, dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0 && dist < 120) { const f = (120-dist)/120*1.5; p.vx += (dx/dist)*f*.1; p.vy += (dy/dist)*f*.1; }
        p.vx *= .98; p.vy *= .98; p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + p.alpha + ')'; ctx.fill();
      });
    }
    requestAnimationFrame(animate);
  })();
};
document.querySelectorAll('.particle-canvas').forEach(c => window.initParticles(c, { count: 55 }));
</script>
