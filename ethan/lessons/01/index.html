<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice-Test Error Pattern Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F7FF;
  --surface:#ffffff;
  --ink:#1f1f1f;
  --ink-2:#4a4a4a;
  --ink-3:#767676;
  --line:rgba(201,212,228,0.45);
  --e1:#3E5C9A; --e1-soft:rgba(62,92,154,0.10);
  --e2:#7A5C9E; --e2-soft:rgba(122,92,158,0.10);
  --e3:#9A5C6A; --e3-soft:rgba(154,92,106,0.10);
  --m1:#1D7A5C; --m1-soft:rgba(29,122,92,0.10);
  --m2:#B45309; --m2-soft:rgba(180,83,9,0.10);
  --font-display:'Baloo 2','Nunito',sans-serif;
  --font-body:'Nunito',sans-serif;
  --font-math:'Nunito',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:var(--font-body);color:var(--ink);overflow:hidden;height:100vh;width:100vw;font-weight:400;}
.deck{width:100vw;height:100vh;position:relative;}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(0.97);transition:opacity 0.5s ease,transform 0.5s ease;pointer-events:none;overflow:hidden;}
.slide.active{opacity:1;transform:scale(1);pointer-events:all;}
.slide>.content{position:relative;z-index:2;width:100%;max-width:1100px;padding:clamp(1rem,3vw,2.6rem);max-height:94vh;overflow-y:auto;}

.nav-controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:100;background:rgba(255,255,255,0.94);backdrop-filter:blur(12px);padding:8px 20px;border-radius:40px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(201,212,228,0.32),0 2px 8px rgba(201,212,228,0.18);}
.nav-btn{width:36px;height:36px;border:none;background:#EDF2F9;color:var(--ink);border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}
.nav-btn:hover{background:#DCE7F7;}
.slide-dots{display:flex;gap:5px;flex-wrap:wrap;max-width:340px;}
.slide-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,0.18);cursor:pointer;transition:background 0.3s,transform 0.3s;}
.slide-dots .dot.active{background:var(--ink);transform:scale(1.35);}
.slide-counter{font-size:0.75rem;color:var(--ink-3);min-width:44px;text-align:center;font-weight:600;}
.reveal{opacity:0;transform:translateY(16px);}

.zone-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.9rem;}
.zone-chip{display:inline-flex;align-items:center;gap:6px;font-size:0.67rem;font-weight:500;letter-spacing:0.01em;padding:4px 11px;border-radius:20px;background:var(--surface);border:1px solid rgba(201,212,228,0.45);color:var(--ink-3);white-space:nowrap;}
.zone-chip .zdot{width:7px;height:7px;border-radius:50%;background:var(--dc,#C9D4E4);flex:none;}
.zone-chip.on{color:#fff;font-weight:600;background:var(--dc);border-color:var(--dc);}
.zone-chip.on .zdot{background:rgba(255,255,255,0.85);}
.zone-chip .zt{opacity:0.75;font-weight:400;}
.zone-chip.on .zt{opacity:0.9;}

h1.deck-title{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;margin:0;}
h2.slide-title{font-family:var(--font-display);font-size:clamp(1.35rem,2.6vw,1.95rem);font-weight:600;letter-spacing:-0.01em;margin:0 0 0.85rem;color:var(--ink);}
h2.slide-title .tint{color:var(--zc);}
.kicker{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;color:var(--zc,var(--ink-3));margin-bottom:0.35rem;}

.math{font-family:var(--font-math);font-weight:700;font-size:1.4rem;color:var(--ink);letter-spacing:0.02em;font-variant-numeric:lining-nums;}
.math-inline{font-family:var(--font-math);font-weight:700;font-size:1.05em;}
.prose{font-size:0.9rem;color:var(--ink-2);line-height:1.6;}
.prob-text{font-size:0.9rem;color:var(--ink);font-weight:600;line-height:1.5;}

.prob-card{background:var(--surface);border:1px solid rgba(201,212,228,0.45);border-radius:14px;padding:0.8rem 1rem;box-shadow:0 10px 24px rgba(201,212,228,0.20),0 2px 6px rgba(201,212,228,0.14);}
.prob-head{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;flex-wrap:wrap;}
.prob-num{font-family:var(--font-display);font-weight:600;font-size:0.82rem;color:var(--ink);background:var(--zs,#EDF2F9);border-radius:8px;padding:2px 10px;}
.lvl-badge{font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:3px 9px;border-radius:20px;}
.lvl-1{background:#E8EDF5;color:#3D4C63;}
.lvl-2{background:#DCEBFB;color:#1D4ED8;}
.lvl-3{background:#FBEBCF;color:#B45309;}
.lvl-4{background:#E2E2E2;color:#3D3D3D;}
.info-card{background:var(--surface);border:1px solid rgba(201,212,228,0.45);border-radius:14px;padding:0.8rem 1rem;box-shadow:0 10px 24px rgba(201,212,228,0.20),0 2px 6px rgba(201,212,228,0.14);}
.trap-card{border:1px solid rgba(201,212,228,0.45);background:#F6F6F6;border-radius:12px;padding:0.65rem 0.9rem;}
.trap-title{font-weight:700;font-size:0.82rem;color:#3D3D3D;}
.trap-body{font-size:0.82rem;color:var(--ink-2);margin-top:0.25rem;line-height:1.5;}
.win-card{border:1px solid rgba(201,212,228,0.45);border-left:5px solid var(--m1);background:#F4FBF5;border-radius:12px;padding:0.65rem 0.9rem;}
.win-title{font-weight:700;font-size:0.82rem;color:#15803D;}
.formula-box{background:var(--zs,#EDF2F9);border:1px solid color-mix(in srgb, var(--zc,var(--ink-3)) 35%, white);border-radius:12px;padding:0.5rem 1rem;text-align:center;}
.formula-box .math{font-size:1.2rem;}
.diagram-wrap{background:var(--surface);border:1px solid rgba(201,212,228,0.45);border-radius:14px;padding:0.6rem;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(201,212,228,0.20),0 2px 6px rgba(201,212,228,0.14);}
.diagram-wrap svg text{font-family:var(--font-math);}

.work-box{border:1px dashed rgba(185,198,217,0.7);border-radius:10px;background:#F9FBFE;overflow:hidden;}
.work-box textarea{width:100%;min-height:3.4rem;border:none;background:transparent;resize:vertical;padding:0.55rem 0.8rem;font-size:0.95rem;color:var(--ink-2);font-family:var(--font-math);line-height:1.5;outline:none;}
.work-box textarea::placeholder{color:#9AA9BF;}
.work-box textarea:focus{background:#F1F6FD;}

.tl-row{display:grid;grid-template-columns:80px 14px 1fr;gap:0 0.8rem;align-items:stretch;}
.tl-time{font-family:var(--font-math);font-weight:700;font-size:0.8rem;color:var(--rc);text-align:right;padding-top:0.6rem;letter-spacing:0.02em;}
.tl-rail{position:relative;display:flex;justify-content:center;}
.tl-rail::before{content:'';position:absolute;top:0;bottom:0;width:2px;background:var(--line);}
.tl-rail .tl-dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--rc);border:3px solid var(--bg);margin-top:0.6rem;box-shadow:0 0 0 2px color-mix(in srgb, var(--rc) 45%, white),0 6px 14px rgba(201,212,228,0.16);}
.tl-card{background:var(--surface);border:1px solid rgba(201,212,228,0.45);border-radius:12px;padding:0.5rem 0.85rem;margin-bottom:0.5rem;box-shadow:0 8px 20px rgba(201,212,228,0.18),0 2px 5px rgba(201,212,228,0.12);}
.tl-card .tl-h{font-weight:600;font-size:0.88rem;color:var(--ink);}
.tl-card .tl-b{font-size:0.79rem;color:var(--ink-2);margin-top:0.15rem;line-height:1.45;}
.tl-card .tl-b em{color:var(--rc);font-style:normal;font-weight:600;}
.tag{display:inline-block;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
.tag.hot{background:#E2E2E2;color:#3D3D3D;}
.tag.cool{background:#E8F7EC;color:#15803D;}
.reflection{border:1px solid rgba(201,212,228,0.45);background:#EFEFEF;border-radius:12px;padding:0.65rem 0.9rem;}
.reflection-title{font-weight:700;font-size:0.82rem;color:#2E2E2E;}
.reflection-body{font-size:0.85rem;color:var(--ink-2);margin-top:0.2rem;line-height:1.5;}
.clue-list{list-style:none;display:flex;flex-direction:column;gap:0.4rem;margin-top:0.5rem;}
.clue-item{display:flex;gap:0.5rem;align-items:flex-start;font-size:0.83rem;color:var(--ink-2);line-height:1.45;}
.clue-num{font-family:var(--font-math);font-weight:700;font-size:0.75rem;color:var(--zc,var(--ink-3));background:var(--zs,#EDF2F9);border-radius:50%;width:1.3rem;height:1.3rem;min-width:1.3rem;display:flex;align-items:center;justify-content:center;}

@media (prefers-reduced-motion: reduce){.reveal{opacity:1!important;transform:none!important;}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:rgba(201,212,228,0.6);border-radius:3px;}
</style>
</head>

</div>
<script id="slide-data" type="application/json">
["\n<div class=\"content\" style=\"text-align:center;\">\n  <div class=\"reveal\" style=\"display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid rgba(201,212,228,0.45);border-radius:24px;padding:6px 16px;font-size:0.72rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:1rem;\">\n    <span style=\"width:8px;height:8px;border-radius:50%;background:var(--e1);\"></span> Practice-Test Error Pattern Review &middot; Math Only\n  </div>\n  <h1 class=\"deck-title reveal\" style=\"font-size:clamp(2rem,5vw,3.4rem);\">Test 1 Error Review<br><span style=\"color:var(--e1);\">Find the Clue, Not the Answer</span></h1>\n  <h2 class=\"reveal\" style=\"font-family:var(--font-display);font-size:clamp(1rem,2vw,1.4rem);font-weight:500;color:var(--ink-2);margin:0.7rem 0 0.4rem;\">60 Minutes &nbsp;&middot;&nbsp; Question-by-Question Review</h2>\n  <p class=\"reveal\" style=\"font-size:0.8rem;color:var(--ink-3);letter-spacing:0.14em;text-transform:uppercase;font-weight:500;margin:0 0 1.2rem;\">SHSAT Prep &middot; Measurement &middot; Probability &middot; Inequalities &middot; Algebra &middot; Geometry</p>\n  <div class=\"reveal\" style=\"display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;\">\n    <span style=\"background:var(--e1-soft);color:var(--e1);border-radius:20px;padding:6px 15px;font-size:0.78rem;font-weight:600;\">3D Composite Volume &amp; Surface Area</span>\n    <span style=\"background:var(--e2-soft);color:var(--e2);border-radius:20px;padding:6px 15px;font-size:0.78rem;font-weight:600;\">\"At Least\" Probability</span>\n    <span style=\"background:var(--e3-soft);color:var(--e3);border-radius:20px;padding:6px 15px;font-size:0.78rem;font-weight:600;\">Inequality Shading</span>\n    <span style=\"background:var(--m1-soft);color:var(--m1);border-radius:20px;padding:6px 15px;font-size:0.78rem;font-weight:600;\">Exponents &amp; Factoring</span>\n    <span style=\"background:var(--m2-soft);color:var(--m2);border-radius:20px;padding:6px 15px;font-size:0.78rem;font-weight:600;\">Angle &amp; Triangle Geometry</span>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"kicker reveal\" style=\"color:var(--ink-3);\">Session Roadmap</div>\n  <h2 class=\"slide-title reveal\">Today's 60-Minute Watch List</h2>\n  <div class=\"reveal\">\n    <div class=\"tl-row\" style=\"--rc:var(--ink-3);\">\n      <div class=\"tl-time\">0:00-0:05</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\"><div class=\"tl-h\">Agenda Setting &middot; Sort the Errors</div>\n        <div class=\"tl-b\">We sort your flagged questions into four buckets before touching any content. <em>Wrong + unsure gets taught first.</em></div></div>\n    </div>\n    <div class=\"tl-row\" style=\"--rc:var(--e1);\">\n      <div class=\"tl-time\">0:05-0:15</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\"><div class=\"tl-h\">Zone 1 &middot; Composite 3D Figures<span class=\"tag hot\">0% Zone</span></div>\n        <div class=\"tl-b\">Q62 (volume) and Q114 (surface area) &mdash; both composite solids. <em>Split the shape into pieces you already know.</em></div></div>\n    </div>\n    <div class=\"tl-row\" style=\"--rc:var(--e2);\">\n      <div class=\"tl-time\">0:15-0:27</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\"><div class=\"tl-h\">Zone 2 &middot; \"At Least\" Probability<span class=\"tag hot\">High-Frequency</span></div>\n        <div class=\"tl-b\">Q72 and Q74 &mdash; recurring probability misses. <em>Complement rule: what's easier to count, this or everything else?</em></div></div>\n    </div>\n    <div class=\"tl-row\" style=\"--rc:var(--e3);\">\n      <div class=\"tl-time\">0:27-0:35</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\"><div class=\"tl-h\">Zone 3 &middot; Inequality Shading</div>\n        <div class=\"tl-b\">Q106 &mdash; coordinate-plane region matching. <em>Test one point, don't just look at the boundary.</em></div></div>\n    </div>\n    <div class=\"tl-row\" style=\"--rc:var(--m1);\">\n      <div class=\"tl-time\">0:35-0:45</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\"><div class=\"tl-h\">Zone 4 &middot; Exponents &amp; Factoring</div>\n        <div class=\"tl-b\">Q78, Q95, Q65 &mdash; algebra cleanup on your strongest domain. <em>Rules first, then pattern-match the structure.</em></div></div>\n    </div>\n    <div class=\"tl-row\" style=\"--rc:var(--m2);\">\n      <div class=\"tl-time\">0:45-0:52</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\"><div class=\"tl-h\">Zone 5 &middot; Angle Bisector Geometry<span class=\"tag hot\">Hardest</span></div>\n        <div class=\"tl-b\">Q97 &mdash; right-triangle angle bisector with a 30&deg; angle. <em>Two smaller right triangles are hiding inside.</em></div></div>\n    </div>\n    <div class=\"tl-row\" style=\"--rc:var(--ink-3);\">\n      <div class=\"tl-time\">0:52-0:60</div>\n      <div class=\"tl-rail\"><div class=\"tl-dot\"></div></div>\n      <div class=\"tl-card\" style=\"margin-bottom:0;\"><div class=\"tl-h\">Prove-It Check &amp; Summary</div>\n        <div class=\"tl-b\">Mixed fresh items, no hints, then you state the two biggest takeaways. <em>Name the strategy before you touch an answer.</em></div></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"kicker reveal\" style=\"color:var(--ink-3);\">Warm-Up &middot; Error Triage</div>\n  <h2 class=\"slide-title reveal\">Sort Before We Teach: <span class=\"tint\" style=\"color:var(--e1);\">Which Bucket Is Each Question In?</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;\">\n    <div class=\"reflection reveal\">\n      <div class=\"reflection-title\">Think first</div>\n      <div class=\"reflection-body\">For each flagged question &mdash; Q62, Q65, Q72, Q74, Q78, Q95, Q97, Q106, Q114 &mdash; ask yourself: did I get it wrong, and was I unsure or confident? Say your answer out loud for two questions before we start.</div>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n    <div class=\"info-card reveal\">\n      <div style=\"font-weight:700;font-size:0.85rem;margin-bottom:0.5rem;\">The Four Buckets</div>\n      <div class=\"clue-list\" style=\"margin-top:0;\">\n        <li class=\"clue-item\"><span class=\"clue-num\" style=\"background:#FBEBCF;color:#B45309;\">1</span> Wrong + unsure &mdash; genuine gap, review first</li>\n        <li class=\"clue-item\"><span class=\"clue-num\" style=\"background:#FDE2E2;color:#B91C1C;\">2</span> Wrong + confident &mdash; dangerous misconception, review second</li>\n        <li class=\"clue-item\"><span class=\"clue-num\" style=\"background:#DCEBFB;color:#1D4ED8;\">3</span> Correct + unsure &mdash; confirm the method</li>\n        <li class=\"clue-item\"><span class=\"clue-num\" style=\"background:#E2E2E2;color:#3D3D3D;\">4</span> Correct + confident &mdash; skip or spot-check</li>\n      </div>\n    </div>\n  </div>\n  <div class=\"trap-card reveal\" style=\"margin-top:0.9rem;\">\n    <div class=\"trap-title\">Today's Habit Target</div>\n    <div class=\"trap-body\">Before you touch any answer choice, state out loud: \"What is this question actually testing?\" That one sentence prevents most careless errors on both easy and hard items.</div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"1\"></div>\n  <div class=\"kicker reveal\">Zone 1 &middot; Composite 3D Figures<span class=\"tag hot\">0% Zone</span></div>\n  <h2 class=\"slide-title reveal\">A Composite Solid Is Just <span class=\"tint\">Two Shapes You Already Know, Glued Together</span></h2>\n  <div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:1rem;align-items:center;\">\n    <div>\n      <div class=\"reflection reveal\" style=\"margin-bottom:0.75rem;\">\n        <div class=\"reflection-title\">Think about it</div>\n        <div class=\"reflection-body\">If a shape is described as \"a cuboid with a square pyramid on top,\" how many separate volume formulas do you need before you can find the total volume? Can you name both formulas from memory right now?</div>\n        <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n      </div>\n      <div class=\"formula-box reveal\">\n        <div style=\"font-size:0.78rem;font-weight:600;color:var(--ink-2);margin-bottom:0.3rem;\">Two formulas, then add</div>\n        <div class=\"math\" style=\"font-size:1.05rem;\">V(cuboid) = l &middot; w &middot; h &nbsp;&nbsp;+&nbsp;&nbsp; V(pyramid) = &#8531; &middot; B &middot; h</div>\n      </div>\n    </div>\n    <div class=\"diagram-wrap reveal\">\n      <svg width=\"260\" height=\"220\" viewBox=\"0 0 260 220\">\n        <polygon points=\"40,140 40,190 170,190 170,140\" fill=\"#DCEBFB\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"40,140 70,110 200,110 170,140\" fill=\"#EDF2F9\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"170,140 200,110 200,160 170,190\" fill=\"#C9D9EF\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"70,110 135,40 200,110\" fill=\"#FBEBCF\" stroke=\"#B45309\" stroke-width=\"2\"/>\n        <polygon points=\"70,110 135,40 170,140 40,140\" fill=\"#FCE8C9\" stroke=\"#B45309\" stroke-width=\"2\" opacity=\"0.85\"/>\n        <polygon points=\"200,110 135,40 170,140\" fill=\"#F6D9A8\" stroke=\"#B45309\" stroke-width=\"2\" opacity=\"0.85\"/>\n        <line x1=\"135\" y1=\"40\" x2=\"135\" y2=\"125\" stroke=\"#B45309\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n        <text x=\"140\" y=\"85\" font-family=\"Nunito, sans-serif\" font-size=\"13\" fill=\"#B45309\" font-weight=\"700\">h</text>\n        <text x=\"30\" y=\"170\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3E5C9A\">6 cm</text>\n        <text x=\"90\" y=\"205\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3E5C9A\">16 cm</text>\n      </svg>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"1\"></div>\n  <div class=\"kicker reveal\">Zone 1 &middot; Question 62 (Grid-In)</div>\n  <h2 class=\"slide-title reveal\">Cuboid + Pyramid: <span class=\"tint\">Solve for h</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.1fr;gap:1rem;\">\n    <div class=\"diagram-wrap reveal\">\n      <svg width=\"230\" height=\"200\" viewBox=\"0 0 230 200\">\n        <polygon points=\"35,120 35,165 155,165 155,120\" fill=\"#DCEBFB\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"35,120 62,95 182,95 155,120\" fill=\"#EDF2F9\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"155,120 182,95 182,140 155,165\" fill=\"#C9D9EF\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"62,95 118,30 182,95\" fill=\"#FBEBCF\" stroke=\"#B45309\" stroke-width=\"2\"/>\n        <polygon points=\"62,95 118,30 155,120 35,120\" fill=\"#FCE8C9\" stroke=\"#B45309\" stroke-width=\"2\" opacity=\"0.85\"/>\n        <polygon points=\"182,95 118,30 155,120\" fill=\"#F6D9A8\" stroke=\"#B45309\" stroke-width=\"2\" opacity=\"0.85\"/>\n        <line x1=\"118\" y1=\"30\" x2=\"118\" y2=\"107\" stroke=\"#B45309\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n        <text x=\"123\" y=\"72\" font-family=\"Nunito, sans-serif\" font-size=\"13\" fill=\"#B45309\" font-weight=\"700\">h</text>\n        <text x=\"20\" y=\"145\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3E5C9A\">6 cm</text>\n        <text x=\"80\" y=\"180\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3E5C9A\">16 cm</text>\n        <text x=\"60\" y=\"18\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#767676\">square base 16 &times; 16</text>\n      </svg>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q62</span>\n        <span class=\"lvl-badge lvl-3\">Level 3 &middot; Grid-In</span>\n      </div>\n      <div class=\"prob-text\">Cuboid (16 cm &times; 16 cm base, 6 cm height) + square pyramid (16 cm base, height h) on top. Total volume = 1,920 cm&sup3;. Find h.</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> Write the two volume formulas separately before combining anything.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Find the cuboid's volume first &mdash; it has no unknowns.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Subtract that from 1,920 to isolate the pyramid's volume alone.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> The pyramid's base area is 16 &times; 16 &mdash; plug into V = &#8531;Bh and solve for h.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"1\"></div>\n  <div class=\"kicker reveal\">Zone 1 &middot; Question 114</div>\n  <h2 class=\"slide-title reveal\">Square Prism Surface Area: <span class=\"tint\">Count Every Face Once</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.1fr;gap:1rem;\">\n    <div class=\"diagram-wrap reveal\">\n      <svg width=\"220\" height=\"190\" viewBox=\"0 0 220 190\">\n        <polygon points=\"40,60 40,140 130,140 130,60\" fill=\"#DCEBFB\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"40,60 65,35 155,35 130,60\" fill=\"#EDF2F9\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <polygon points=\"130,60 155,35 155,115 130,140\" fill=\"#C9D9EF\" stroke=\"#3E5C9A\" stroke-width=\"2\"/>\n        <text x=\"75\" y=\"105\" font-family=\"Nunito, sans-serif\" font-size=\"13\" fill=\"#3E5C9A\" font-weight=\"700\">6 in</text>\n        <text x=\"35\" y=\"30\" font-family=\"Nunito, sans-serif\" font-size=\"13\" fill=\"#3E5C9A\" font-weight=\"700\">6 in</text>\n        <text x=\"145\" y=\"95\" font-family=\"Nunito, sans-serif\" font-size=\"13\" fill=\"#3E5C9A\" font-weight=\"700\">8 in</text>\n      </svg>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q114</span>\n        <span class=\"lvl-badge lvl-2\">Level 2 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">What is the surface area of the square prism with dimensions 6 in, 6 in, and 8 in?</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> A rectangular prism has 6 faces &mdash; but here two are squares (6&times;6) and four are rectangles.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> List the 3 distinct face-pairs: which dimensions multiply to give each face's area?</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> SA = 2(lw) + 2(lh) + 2(wh) &mdash; substitute 6, 6, 8 into each term separately.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> Add all six face areas together before matching to an answer choice.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"2\"></div>\n  <div class=\"kicker reveal\">Zone 2 &middot; \"At Least\" Probability<span class=\"tag hot\">High-Frequency</span></div>\n  <h2 class=\"slide-title reveal\">\"At Least\" Means <span class=\"tint\" style=\"color:var(--e2);\">Count Everything Except the Small Piece</span></h2>\n  <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:1rem;align-items:center;\">\n    <div>\n      <div class=\"reflection reveal\" style=\"margin-bottom:0.75rem;\">\n        <div class=\"reflection-title\">Think about it</div>\n        <div class=\"reflection-body\">If a question asks for the probability of \"at least 3 heads\" out of 4 flips, is it faster to add up P(3 heads) + P(4 heads), or is there ever a case where subtracting from 1 is faster? What determines which approach wins?</div>\n        <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n      </div>\n      <div class=\"win-card reveal\">\n        <div class=\"win-title\">Two valid strategies</div>\n        <div class=\"prose\" style=\"font-size:0.83rem;margin-top:0.2rem;\">Direct sum: add every outcome that satisfies \"at least\" (works well when there are only 1-2 favorable outcomes). Complement: 1 minus everything below the threshold (better when the favorable region is large).</div>\n      </div>\n    </div>\n    <div class=\"formula-box reveal\">\n      <div style=\"font-size:0.78rem;font-weight:600;color:var(--ink-2);margin-bottom:0.3rem;\">Complement Rule</div>\n      <div class=\"math\">P(at least k) = 1 &minus; P(fewer than k)</div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"2\"></div>\n  <div class=\"kicker reveal\">Zone 2 &middot; Question 72</div>\n  <h2 class=\"slide-title reveal\">Coin Toss Table: <span class=\"tint\" style=\"color:var(--e2);\">Read the Frequencies Correctly</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:1rem;\">\n    <div class=\"diagram-wrap reveal\" style=\"padding:0.9rem;\">\n      <table style=\"width:100%;font-family:var(--font-math);font-size:0.78rem;border-collapse:collapse;\">\n        <tr style=\"background:#EDF2F9;\"><td style=\"padding:5px 8px;font-weight:700;\">Heads</td><td style=\"padding:5px 8px;\">0</td><td style=\"padding:5px 8px;\">1</td><td style=\"padding:5px 8px;\">2</td><td style=\"padding:5px 8px;background:#DCEBFB;\">3</td><td style=\"padding:5px 8px;background:#DCEBFB;\">4</td></tr>\n        <tr><td style=\"padding:5px 8px;font-weight:700;\">Times</td><td style=\"padding:5px 8px;\">2</td><td style=\"padding:5px 8px;\">4</td><td style=\"padding:5px 8px;\">7</td><td style=\"padding:5px 8px;background:#DCEBFB;font-weight:700;\">6</td><td style=\"padding:5px 8px;background:#DCEBFB;font-weight:700;\">1</td></tr>\n      </table>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q72</span>\n        <span class=\"lvl-badge lvl-2\">Level 2 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">Four coins tossed 20 times. Using this experimental data, what is the probability of getting at least 3 heads on the next toss?</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> \"At least 3\" includes exactly which two rows of the table?</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Add the \"times\" values for those rows only &mdash; do not include the row for 2 heads.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Divide that sum by the total number of trials (20), not by the number of rows.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> This is experimental probability, so use the table's actual counts, not a coin-flip formula.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"2\"></div>\n  <div class=\"kicker reveal\">Zone 2 &middot; Question 74</div>\n  <h2 class=\"slide-title reveal\">Which Probability Statement Is <span class=\"tint\" style=\"color:var(--e2);\">Actually Plausible?</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:1rem;\">\n    <div class=\"info-card reveal\">\n      <div style=\"font-weight:700;font-size:0.85rem;margin-bottom:0.5rem;\">Real-World Sanity Check</div>\n      <div class=\"prose\">This question has no calculation &mdash; it tests your intuition for what a probability value actually implies about how often something happens.</div>\n      <div class=\"formula-box\" style=\"margin-top:0.6rem;\">\n        <div class=\"math\" style=\"font-size:0.95rem;\">p = 0.05 &rarr; rare &nbsp;&middot;&nbsp; p = 0.95 &rarr; almost certain</div>\n      </div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q74</span>\n        <span class=\"lvl-badge lvl-2\">Level 2 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">Which of the following statements is most likely to be true, based on realistic probability values for each scenario described?</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> For each answer choice, ask: \"in real life, does this event happen often, rarely, or almost always?\"</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Cross out any choice pairing an extremely rare event with a high probability value (or vice versa).</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Compare lottery jackpot odds, tiger encounters, and Ivy League admission rates to what you know about the real world.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> Only one remaining choice pairs a genuinely common, controllable outcome with a high probability.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"3\"></div>\n  <div class=\"kicker reveal\">Zone 3 &middot; Question 106<span class=\"tag hot\">Test-Point Method</span></div>\n  <h2 class=\"slide-title reveal\">Shaded Region: <span class=\"tint\" style=\"color:var(--e3);\">Pick a Point, Don't Just Eyeball It</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:1rem;\">\n    <div class=\"diagram-wrap reveal\">\n      <svg width=\"230\" height=\"200\" viewBox=\"0 0 230 200\">\n        <line x1=\"10\" y1=\"100\" x2=\"220\" y2=\"100\" stroke=\"#C9D4E4\" stroke-width=\"1.5\"/>\n        <line x1=\"115\" y1=\"10\" x2=\"115\" y2=\"190\" stroke=\"#C9D4E4\" stroke-width=\"1.5\"/>\n        <polygon points=\"10,10 210,10 10,190\" fill=\"#9A5C6A\" opacity=\"0.16\"/>\n        <line x1=\"10\" y1=\"190\" x2=\"215\" y2=\"15\" stroke=\"#9A5C6A\" stroke-width=\"2.5\"/>\n        <text x=\"30\" y=\"30\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#9A5C6A\" font-weight=\"700\">shaded region</text>\n        <text x=\"200\" y=\"105\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#767676\">x</text>\n        <text x=\"120\" y=\"20\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#767676\">y</text>\n        <circle cx=\"60\" cy=\"60\" r=\"3\" fill=\"#3E5C9A\"/>\n        <text x=\"65\" y=\"58\" font-family=\"Nunito, sans-serif\" font-size=\"10\" fill=\"#3E5C9A\">test pt</text>\n      </svg>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q106</span>\n        <span class=\"lvl-badge lvl-3\">Level 3 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">Which inequality is represented by the shaded region on the coordinate plane below?</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> Find the boundary line's equation first &mdash; identify the slope and y-intercept from the graph.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Is the boundary line solid or dashed? That tells you whether the inequality includes \"or equal to.\"</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Pick one clear point inside the shaded region (not on the line) &mdash; plug its x and y into each answer choice.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> The correct inequality is the one that point makes TRUE. Don't just match the line's equation &mdash; verify the direction of shading.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"4\"></div>\n  <div class=\"kicker reveal\">Zone 4 &middot; Exponents &amp; Factoring<span class=\"tag cool\">Your Strongest Domain</span></div>\n  <h2 class=\"slide-title reveal\">Same Rules, <span class=\"tint\" style=\"color:var(--m1);\">Different Disguises</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;\">\n    <div class=\"formula-box reveal\">\n      <div style=\"font-size:0.78rem;font-weight:600;color:var(--ink-2);margin-bottom:0.3rem;\">Exponent Rules</div>\n      <div class=\"math\" style=\"font-size:1.05rem;\">(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup> &nbsp;&middot;&nbsp; a<sup>-n</sup> = 1/a<sup>n</sup></div>\n    </div>\n    <div class=\"formula-box reveal\">\n      <div style=\"font-size:0.78rem;font-weight:600;color:var(--ink-2);margin-bottom:0.3rem;\">Difference of Squares</div>\n      <div class=\"math\" style=\"font-size:1.05rem;\">a&sup2; &minus; b&sup2; = (a&minus;b)(a+b)</div>\n    </div>\n  </div>\n  <div class=\"reflection reveal\" style=\"margin-top:0.9rem;\">\n    <div class=\"reflection-title\">Think about it</div>\n    <div class=\"reflection-body\">These aren't three unrelated skills &mdash; they're the same handful of rules applied to unfamiliar-looking expressions. What's the very first thing you should look for whenever you see nested exponents or a subtraction of two perfect squares?</div>\n    <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"4\"></div>\n  <div class=\"kicker reveal\">Zone 4 &middot; Question 78</div>\n  <h2 class=\"slide-title reveal\">Simplify: <span class=\"tint\" style=\"color:var(--m1);\">Work Inside-Out</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.1fr;gap:1rem;\">\n    <div class=\"formula-box reveal\">\n      <div class=\"math\">((a<sup>5</sup>)<sup>-2</sup>)<sup>-1</sup> / (a<sup>6</sup> &middot; a<sup>2</sup>)</div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q78</span>\n        <span class=\"lvl-badge lvl-2\">Level 2 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">Simplify: [(a&#8309;)<sup>&minus;2</sup>]<sup>&minus;1</sup> &divide; (a&#8310; &middot; a&sup2;)</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> Handle the numerator's nested exponents first: multiply the two outer exponents together with the 5.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Watch the signs carefully &mdash; a negative times a negative exponent gives a positive exponent.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> In the denominator, when multiplying same-base powers, add the exponents (don't multiply).</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> Finally, divide same-base powers by subtracting the denominator's exponent from the numerator's.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"4\"></div>\n  <div class=\"kicker reveal\">Zone 4 &middot; Question 95</div>\n  <h2 class=\"slide-title reveal\">Spot the <span class=\"tint\" style=\"color:var(--m1);\">Hidden Difference of Squares</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.1fr;gap:1rem;\">\n    <div class=\"formula-box reveal\">\n      <div class=\"math\">x &minus; 9y&sup2;</div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q95</span>\n        <span class=\"lvl-badge lvl-3\">Level 3 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">Which expression is equivalent to x &minus; 9y&sup2;? (Answer choices involve &radic;x and (x&minus;3y)(x+3y)-style factors.)</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> The expression subtracts one term from another &mdash; is each term a perfect square? Rewrite x as (&radic;x)&sup2;.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Once both terms are perfect squares, difference of squares factors as (first &minus; second)(first + second).</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Be careful with the square root of x versus x itself &mdash; don't drop the radical sign in your factors.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> Multiply your factored answer back out mentally to verify it returns the original expression.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"4\"></div>\n  <div class=\"kicker reveal\">Zone 4 &middot; Question 65</div>\n  <h2 class=\"slide-title reveal\">Match Coefficients: <span class=\"tint\" style=\"color:var(--m1);\">Expand, Then Compare</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.1fr;gap:1rem;\">\n    <div class=\"formula-box reveal\">\n      <div class=\"math\" style=\"font-size:1.05rem;\">x&sup3; + 3x &minus; 4 = (x&minus;1)(x&sup2; + ax + b)</div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q65</span>\n        <span class=\"lvl-badge lvl-4\">Level 4 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">If x&sup3; + 3x &minus; 4 = (x &minus; 1)(x&sup2; + ax + b), what is the value of a + b?</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> Multiply out (x &minus; 1)(x&sup2; + ax + b) completely using distribution.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Line up your expanded result with x&sup3; + 3x &minus; 4 term by term &mdash; note there's no x&sup2; term on the left side.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Since the x&sup2; coefficient on the left is 0, set the x&sup2; terms from your expansion equal to 0 to solve for a.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> Use the matched constant terms (or the x-coefficient) to solve for b, then add a + b.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"zone-strip reveal\" data-zone=\"5\"></div>\n  <div class=\"kicker reveal\">Zone 5 &middot; Question 97<span class=\"tag hot\">Hardest Item</span></div>\n  <h2 class=\"slide-title reveal\">Angle Bisector: <span class=\"tint\" style=\"color:var(--m2);\">Two Right Triangles Hiding Inside</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:1rem;\">\n    <div class=\"diagram-wrap reveal\">\n      <svg width=\"240\" height=\"200\" viewBox=\"0 0 240 200\">\n        <polygon points=\"30,170 120,20 210,170\" fill=\"none\" stroke=\"#B45309\" stroke-width=\"2\"/>\n        <line x1=\"120\" y1=\"20\" x2=\"120\" y2=\"170\" stroke=\"#B45309\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n        <text x=\"15\" y=\"185\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3D3D3D\" font-weight=\"700\">C</text>\n        <text x=\"115\" y=\"12\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3D3D3D\" font-weight=\"700\">A</text>\n        <text x=\"215\" y=\"185\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3D3D3D\" font-weight=\"700\">B</text>\n        <text x=\"118\" y=\"185\" font-family=\"Nunito, sans-serif\" font-size=\"12\" fill=\"#3D3D3D\" font-weight=\"700\">L</text>\n        <text x=\"55\" y=\"165\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#B45309\">12 cm</text>\n        <text x=\"128\" y=\"45\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#B45309\">30&deg;</text>\n        <text x=\"150\" y=\"60\" font-family=\"Nunito, sans-serif\" font-size=\"11\" fill=\"#3E5C9A\">30&deg;</text>\n      </svg>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\">\n        <span class=\"prob-num\">Q97</span>\n        <span class=\"lvl-badge lvl-4\">Level 4 &middot; Multiple Choice</span>\n      </div>\n      <div class=\"prob-text\">In right triangle ABC, AL is the angle bisector of angle A, and angle B measures 30&deg;. If CL = 12 cm, what is the length of LB?</div>\n      <ul class=\"clue-list\">\n        <li class=\"clue-item\"><span class=\"clue-num\">1</span> AL bisects angle A into two equal 30&deg; pieces &mdash; mark both angles on your own sketch.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">2</span> Focus on right triangle ACL first: you know one angle (30&deg;) and the side opposite it (CL = 12). Use tangent to find AC.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">3</span> Notice triangle ABC is isosceles &mdash; angle B and one bisected half of angle A are equal, so two sides must be equal too.</li>\n        <li class=\"clue-item\"><span class=\"clue-num\">4</span> Use that isosceles relationship (or the Angle Bisector Theorem ratio AB/AC = LB/LC) to solve for LB.</li>\n      </ul>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"kicker reveal\" style=\"color:var(--ink-3);\">Concept Batching</div>\n  <h2 class=\"slide-title reveal\">The Real Pattern: <span class=\"tint\" style=\"color:var(--e1);\">One Skill, Many Question Types</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;\">\n    <div class=\"info-card reveal\">\n      <div style=\"font-weight:700;font-size:0.85rem;margin-bottom:0.4rem;color:var(--e1);\">Decompose First</div>\n      <div class=\"prose\" style=\"font-size:0.83rem;\">Q62 and Q114 both fail if you try to compute the whole shape at once. Split into known pieces every time.</div>\n    </div>\n    <div class=\"info-card reveal\">\n      <div style=\"font-weight:700;font-size:0.85rem;margin-bottom:0.4rem;color:var(--e2);\">Complement or Direct</div>\n      <div class=\"prose\" style=\"font-size:0.83rem;\">Q72 and Q74 both require deciding whether adding favorable outcomes or subtracting from 1 (or from reality) is faster.</div>\n    </div>\n    <div class=\"info-card reveal\">\n      <div style=\"font-weight:700;font-size:0.85rem;margin-bottom:0.4rem;color:var(--m1);\">Rules, Then Structure</div>\n      <div class=\"prose\" style=\"font-size:0.83rem;\">Q78, Q95, and Q65 all reduce to exponent rules or factoring patterns you already know &mdash; the disguise is the only new part.</div>\n    </div>\n    <div class=\"info-card reveal\">\n      <div style=\"font-weight:700;font-size:0.85rem;margin-bottom:0.4rem;color:var(--m2);\">Test a Point</div>\n      <div class=\"prose\" style=\"font-size:0.83rem;\">Q106 is solved fastest by picking one coordinate and checking it against every answer choice, not by pure visual matching.</div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\">\n  <div class=\"kicker reveal\" style=\"color:var(--ink-3);\">Prove-It Check &middot; No Hints</div>\n  <h2 class=\"slide-title reveal\">Fresh Items, <span class=\"tint\" style=\"color:var(--e1);\">Mixed Order, No Warning</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;\">\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\"><span class=\"prob-num\">Mixed 1</span><span class=\"lvl-badge lvl-2\">Level 2</span></div>\n      <div class=\"prob-text\">A cylinder (radius 4 in, height 10 in) sits under a cone with the same radius and height 6 in. What is the shape's total volume, in terms of &pi;?</div>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\"><span class=\"prob-num\">Mixed 2</span><span class=\"lvl-badge lvl-2\">Level 2</span></div>\n      <div class=\"prob-text\">A bag has 3 red and 5 blue marbles. Two are drawn without replacement. What is the probability of drawing at least one red marble?</div>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\"><span class=\"prob-num\">Mixed 3</span><span class=\"lvl-badge lvl-3\">Level 3</span></div>\n      <div class=\"prob-text\">Simplify: (b<sup>-3</sup>)<sup>2</sup> &divide; (b<sup>4</sup> &middot; b<sup>-1</sup>)</div>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n    <div class=\"prob-card reveal\">\n      <div class=\"prob-head\"><span class=\"prob-num\">Mixed 4</span><span class=\"lvl-badge lvl-3\">Level 3</span></div>\n      <div class=\"prob-text\">Which inequality describes a region with a dashed boundary line through (0, 2) with slope &minus;1, shaded above the line?</div>\n      <div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div>\n    </div>\n  </div>\n</div>\n", "\n<div class=\"content\" style=\"text-align:center;\">\n  <div class=\"kicker reveal\" style=\"color:var(--ink-3);text-align:center;\">Session Wrap-Up</div>\n  <h2 class=\"slide-title reveal\" style=\"text-align:center;\">Your Two Takeaways: <span class=\"tint\" style=\"color:var(--e1);\">Say Them Out Loud</span></h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;max-width:800px;margin:0 auto;\">\n    <div class=\"win-card reveal\" style=\"text-align:left;\">\n      <div class=\"win-title\">Takeaway 1</div>\n      <div class=\"prose\" style=\"margin-top:0.3rem;\">Before solving, name the strategy: decompose, complement, rule-match, or test-a-point. The strategy decision matters more than the arithmetic.</div>\n    </div>\n    <div class=\"win-card reveal\" style=\"text-align:left;\">\n      <div class=\"win-title\">Takeaway 2</div>\n      <div class=\"prose\" style=\"margin-top:0.3rem;\">Write one line in your error log tonight: \"When I see ___, I should ___.\" Do this for the question that felt hardest today.</div>\n    </div>\n  </div>\n  <div class=\"reveal\" style=\"max-width:700px;margin:0.9rem auto 0;\"><div class=\"work-box\" style=\"margin-top:0.6rem;\"><textarea placeholder=\"Work here\u2026\" spellcheck=\"false\"></textarea></div></div>\n  <div class=\"trap-card reveal\" style=\"margin-top:0.9rem;max-width:700px;margin-left:auto;margin-right:auto;\">\n    <div class=\"trap-title\">Next Session Preview</div>\n    <div class=\"trap-body\">We'll run a full mixed set spanning all five zones from today, with no advance labeling of which skill each question tests.</div>\n  </div>\n</div>\n"]
</script>
<script>
const ZONES=[
  {n:'3D Composite',t:'0:05',c:'var(--e1)'},
  {n:'At-Least Prob.',t:'0:15',c:'var(--e2)'},
  {n:'Inequality Shading',t:'0:27',c:'var(--e3)'},
  {n:'Exponents/Factoring',t:'0:35',c:'var(--m1)'},
  {n:'Angle Bisector',t:'0:45',c:'var(--m2)'}
];
function renderZones(){
  document.querySelectorAll('.zone-strip').forEach(strip=>{
    const active=parseInt(strip.dataset.zone,10);
    strip.innerHTML=ZONES.map((z,i)=>
      `<span class="zone-chip${i+1===active?' on':''}" style="--dc:${z.c}"><span class="zdot"></span>${z.n}&nbsp;<span class="zt">${z.t}</span></span>`
    ).join('');
  });
}
let current=1;
function renderSlides(){
  const data = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  data.forEach((html,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.dataset.slide=(i+1);
    div.innerHTML=html;
    deck.appendChild(div);
  });
  renderZones();
  const total=data.length;
  const dotsContainer=document.getElementById('dots');
  const counter=document.getElementById('counter');
  for(let i=1;i<=total;i++){const dot=document.createElement('div');dot.className='dot'+(i===1?' active':'');dot.onclick=()=>goToSlide(i);dotsContainer.appendChild(dot);}
  counter.textContent='1 / '+total;
  window.__total=total;
  animateSlide(document.querySelector('.slide.active'));
}
function goToSlide(n){
  const prev=document.querySelector('.slide.active');
  const next=document.querySelector(`.slide[data-slide="${n}"]`);
  if(prev)prev.classList.remove('active');
  if(next){next.classList.add('active');animateSlide(next);}
  current=n;updateNav();
}
function changeSlide(dir){let n=current+dir;const total=window.__total;if(n<1)n=total;if(n>total)n=1;goToSlide(n);}
function updateNav(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i+1===current));document.getElementById('counter').textContent=current+' / '+window.__total;}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();changeSlide(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();changeSlide(-1);}
});
let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{const diff=touchStartX-e.changedTouches[0].clientX;if(Math.abs(diff)>50)changeSlide(diff>0?1:-1);});
function animateSlide(slide){
  if(!slide) return;
  slide.querySelectorAll('.reveal').forEach((el,i)=>{
    el.style.transition='none';el.style.opacity='0';el.style.transform='translateY(16px)';
    el.offsetHeight;
    const delay=i*0.06;
    el.style.transition=`opacity 0.32s ease ${delay}s,transform 0.32s ease ${delay}s`;
    el.style.opacity='1';el.style.transform='translateY(0)';
  });
}
renderSlides();
</script>
</body>
</html>
